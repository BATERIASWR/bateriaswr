          const d=out[0].data;
          let battery=String(d[3]||'');
          if(mk==='HYUNDAI'&&N(model)==='TUCSON'&&fu==='DIESEL') battery='N-70 / BCI 124R';
          return {make:brand,model:out[0].model,year:y,range:[d[0],d[1]],bci:[],cca:[],battery,note:d[4]||'Confirmar aplicación exacta.',exact:true,catalog:true,dieselTucson:mk==='HYUNDAI'&&N(model)==='TUCSON'&&fu==='DIESEL'};
        }
      }
    }
    /* Último recurso: coincidencia parcial por marca/modelo, para no perder vehículos por una variante de nombre. */
    const partial=rows.filter(r=>MK(r.make)===mk&&sameModel(r.model,mo)).slice(0,8);
    if(partial.length)return {make:make||mk,model:model,year:y,bci:[...new Set(partial.flatMap(r=>r.groups||r.bci||[]).map(String))].filter(Boolean),cca:[...new Set(partial.flatMap(r=>r.cca||[]).map(Number).filter(Boolean))],note:'Coincidencia parcial: confirme motor, año, polaridad y dimensiones.',exact:false,partial:true};
    return null;
  }

  window.vehicles=function(){
    app.innerHTML='<div class="page-title"><div><h1>Vehículos</h1><div class="muted">Búsqueda ampliada por marca, modelo, año, combustible y motor.</div></div></div>'+
    '<div class="panel"><h3>🔎 Buscar batería por vehículo</h3><div class="form">'+
    '<label>Marca<input id="wrVMake" placeholder="Ej.: Hyundai, Chevrolet, Toyota"></label>'+
    '<label>Modelo<input id="wrVModel" placeholder="Ej.: Tucson, Cruze, Corolla"></label>'+
    '<label>Año<input id="wrVYear" type="number" min="1980" max="2026" placeholder="2010"></label>'+
    '<label>Combustible<select id="wrVFuel"><option value="">No indicado</option><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Eléctrico</option></select></label>'+
    '<label class="full">Motor / versión (opcional)<input id="wrVEngine" placeholder="Ej.: 2.0 CRDi, 2.4, 1.4 Turbo"></label>'+
    '</div><div class="actions"><button class="btn" onclick="wrVehicleSearch()">🔎 Buscar</button></div><div id="wrVehicleResult"></div></div>'+
    '<div class="panel"><h3>Vehículos registrados</h3><div class="muted">Estos registros provienen de ventas; el catálogo de búsqueda no se guarda aquí.</div>'+
    (db.vehicles.length?'<div class="table-wrap"><table class="table"><thead><tr><th>Marca</th><th>Modelo</th><th>Año</th><th>Combustible</th></tr></thead><tbody>'+db.vehicles.map(x=>'<tr><td>'+E(x.make)+'</td><td>'+E(x.model)+'</td><td>'+E(x.year)+'</td><td>'+E(x.fuel)+'</td></tr>').join('')+'</tbody></table></div>':'<p class="empty">Todavía no hay vehículos registrados.</p>')+'</div>';
    ['wrVMake','wrVModel','wrVYear','wrVFuel','wrVEngine'].forEach(id=>document.getElementById(id)?.addEventListener('keydown',e=>{if(e.key==='Enter')wrVehicleSearch()}));
  };

  window.wrVehicleSearch=function(){
    const make=document.getElementById('wrVMake')?.value.trim()||'',model=document.getElementById('wrVModel')?.value.trim()||'',year=document.getElementById('wrVYear')?.value||'',fuel=document.getElementById('wrVFuel')?.value||'',engine=document.getElementById('wrVEngine')?.value.trim()||'',box=document.getElementById('wrVehicleResult');
    if(!box)return;
    if(!make||!model){box.innerHTML='<div class="notice">Ingrese marca y modelo.</div>';return}
    const r=searchData(make,model,year,fuel,engine);
    if(!r){box.innerHTML='<div class="notice"><b>No encontramos la combinación exacta.</b><br>Pruebe el nombre comercial del modelo o deje el motor en blanco.</div>';return}
    let cca=r.cca?.length?r.cca.join(' / ')+' CCA':'CCA no registrado';
    if(r.dieselTucson) cca='710+ CCA (referencia de trabajo); para Tucson 2.0 CRDi hay referencias publicadas de 830 A';
    const bci=r.bci?.length?r.bci.join(' / '):(r.battery?'Referencia: '+E(r.battery):'BCI no verificado');
    const note=r.dieselTucson?'Tucson 2010–2015 diésel: no mostrar 500 CCA. Confirmar motor, polaridad, dimensiones y batería instalada.':(r.note||'Confirmar batería instalada.');
    box.innerHTML='<div class="vehicle-hit"><h3>🔋 '+E(r.make)+' '+E(r.model)+'</h3>'+
      '<div class="bci-result bci-ok"><span>GRUPO / REFERENCIA</span><strong>'+E(bci)+'</strong><small>'+(r.exact?'Aplicación encontrada':'Coincidencia parcial')+'</small></div>'+
      '<div class="bateria-recomendada">CCA: <b>'+E(cca)+'</b></div>'+
      '<p><b>Años registrados:</b> '+E((r.range||[]).join('–')||'—')+'</p>'+
      '<p><b>Combustible buscado:</b> '+E(fuel||'No indicado')+'</p>'+
      '<p><b>Motor / versión:</b> '+E(engine||'No indicado')+'</p>'+
      '<p><b>Nota:</b> '+E(note)+'</p>'+
      '<p class="nota"><b>Importante:</b> el CCA no es una propiedad única del vehículo; depende de la batería concreta. Antes de vender o instalar comprobar BCI, dimensiones, polaridad, Ah, CCA y batería actualmente instalada.</p></div>';
  };

  window.openSale=function(){
    const a=(db.inventory||[]).filter(x=>Number(x.qty||0)>0);
    if(!a.length){alert('No hay baterías con existencia. Primero vaya a Inventario → + Nueva batería y registre una con cantidad mayor que 0.');return}
    modal('Registrar venta','<form class="form" id="saleFormWR12">'+
      '<label>Fecha<input name="date" type="date" value="'+T()+'" required></label>'+
      '<label class="full">Batería<select name="product" required>'+a.map(x=>'<option value="'+E(x.id)+'">'+E(x.code)+' — '+E(x.brand)+' '+E(x.model)+' — CCA '+E(x.amp||'—')+' — Stock '+x.qty+' — '+M(x.price)+'</option>').join('')+'</select></label>'+
      '<label>Cliente<input name="client" value="Cliente contado"></label><label>Teléfono<input name="phone"></label>'+
      '<label>Cantidad<input name="qty" type="number" min="1" step="1" value="1" required></label><label>Precio unitario<input name="unitPrice" type="number" min="0" step="1" required></label>'+
      '<label>Garantía<input name="warranty" placeholder="Ej.: 24 meses"></label><label>Método de pago<select name="payment"><option>Contado</option><option>Sinpe</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></label>'+
      '<label>Marca vehículo<input name="vehicleMake"></label><label>Modelo vehículo<input name="vehicleModel"></label><label>Año<input name="vehicleYear" type="number" min="1980" max="2026"></label><label>Combustible<select name="fuel"><option value="">No indicado</option><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Eléctrico</option></select></label>'+
      '<label class="full">Observación<input name="note"></label><div class="full actions"><button class="btn">Guardar venta + factura + garantía</button></div></form>');
    const f=document.getElementById('saleFormWR12'),sel=f.elements.product,price=f.elements.unitPrice;
    const sync=()=>{const p=db.inventory.find(x=>String(x.id)===String(sel.value));price.value=Number(p?.price||0)};
    sel.onchange=sync;sync();
    f.onsubmit=e=>{e.preventDefault();const d=new FormData(f),p=db.inventory.find(x=>String(x.id)===String(d.get('product'))),q=Number(d.get('qty')),up=Number(d.get('unitPrice'));
      if(!p)return alert('No se encontró la batería seleccionada.');
      if(!Number.isInteger(q)||q<1||q>Number(p.qty||0))return alert('Cantidad inválida o stock insuficiente.');
      if(!Number.isFinite(up)||up<0)return alert('Precio unitario inválido.');
      const id=Date.now(),sale={id,date:String(d.get('date')||T()),client:String(d.get('client')||'Cliente contado'),phone:String(d.get('phone')||''),product:p.code,productId:p.id,brand:p.brand,model:p.model,voltage:p.voltage||'12V',amp:p.amp||'',profile:p.profile||'',unitCost:Number(p.cost||0),unitPrice:up,total:q*up,qty:q,warranty:String(d.get('warranty')||p.warranty||'Por definir'),payment:String(d.get('payment')||''),note:String(d.get('note')||''),vehicle:{make:String(d.get('vehicleMake')||''),model:String(d.get('vehicleModel')||''),year:String(d.get('vehicleYear')||''),fuel:String(d.get('fuel')||'')}};
      p.qty=Number(p.qty||0)-q;db.sales=db.sales||[];db.sales.push(sale);db.warranties=db.warranties||[];db.warranties.push({id:id+1,date:sale.date,client:sale.client,battery:sale.product,status:'Generada',saleId:id});
      if(sale.vehicle.make&&sale.vehicle.model){db.vehicles=db.vehicles||[];db.vehicles.push({...sale.vehicle,id,battery:sale.product})}
      save();closeModal();sales();setTimeout(()=>window.openInvoice?window.openInvoice(sale):window.openWarrantyReportById(id),100);
    };
  };
})();
</script></body>
