 app.innerHTML=`<div class="page-title"><div><h1>Inicio</h1><div class="muted">Panel de WRBATERIASCR</div></div><button class="btn" onclick="openProduct()">+ Nueva batería</button></div>
 <div class="cards">
 <div class="card"><div class="muted">Baterías en inventario</div><div class="metric">${units}</div></div>
 <div class="card"><div class="muted">Modelos registrados</div><div class="metric">${db.inventory.length}</div></div>
 <div class="card"><div class="muted">Stock bajo</div><div class="metric">${low}</div></div>
 <div class="card"><div class="muted">Ventas de hoy</div><div class="metric">₡${todaySales.toLocaleString("es-CR")}</div></div>
 </div>
 <div class="grid">
  <div class="panel"><h3>Acciones rápidas</h3><div class="actions">
   <button class="btn" onclick="nav('inventario')">Ver inventario</button>
   <button class="btn secondary" onclick="nav('ventas')">Registrar venta</button>
   <button class="btn secondary" onclick="nav('clientes')">Nuevo cliente</button>
  </div></div>
  <div class="panel"><h3>Stock que revisar</h3>${low?`<ul class="list">${db.inventory.filter(x=>Number(x.qty||0)<=2).slice(0,6).map(x=>`<li><b>${esc(x.code)}</b> — ${x.qty} unidad(es)</li>`).join("")}</ul>`:`<div class="kpi-good">No hay baterías con stock bajo.</div>`}</div>
 </div>`;
}
function inventory(){
 app.innerHTML=`<div class="page-title"><div><h1>Inventario</h1><div class="muted">Baterías y existencias</div></div><button class="btn" onclick="openProduct()">+ Nueva batería</button></div>
 <div class="toolbar"><input id="searchInv" class="input" placeholder="Buscar código, marca o modelo..." oninput="filterInv()"></div>
 <div id="invTable"></div>`; drawInv(db.inventory);
}
function drawInv(rows){
 document.getElementById("invTable").innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Código</th><th>Marca</th><th>Modelo</th><th>Voltaje</th><th>Amperaje / CCA</th><th>Perfil</th><th>Compra</th><th>Venta</th><th>Stock</th><th>Proveedor</th><th>Garantía</th><th>Aplicaciones / vehículos</th><th></th></tr></thead><tbody>${rows.length?rows.map(x=>`<tr><td><b>${esc(x.code)}</b></td><td>${esc(x.brand)}</td><td>${esc(x.model)}</td><td>${esc(x.voltage)}</td><td>${esc(x.amp)}</td><td>${esc(x.profile)}</td><td>₡${Number(x.cost||0).toLocaleString("es-CR")}</td><td>₡${Number(x.price||0).toLocaleString("es-CR")}</td><td class="${Number(x.qty)<=2?'stock-low':''}">${x.qty}</td><td>${esc(x.supplier)}</td><td>${esc(x.warranty)}</td><td>${esc(x.vehicles)}</td><td><button class="btn secondary" onclick="editProduct(${x.id})">Editar</button></td></tr>`).join(""):`<tr><td colspan="13" class="empty">No hay baterías registradas.</td></tr>`}</tbody></table></div>`;
}
function filterInv(){const q=document.getElementById("searchInv").value.toLowerCase();drawInv(db.inventory.filter(x=>[x.code,x.brand,x.model,x.vehicles].join(" ").toLowerCase().includes(q)))}
function openProduct(item={}){
 modal("Batería",`<form class="form" id="productForm">
 <label>Código*<input name="code" required value="${esc(item.code)}"></label>
 <label>Marca<input name="brand" value="${esc(item.brand)}"></label>
 <label>Modelo<input name="model" value="${esc(item.model)}"></label>
 <label>Voltaje<input name="voltage" value="${esc(item.voltage||"12V")}"></label>
 <label>Amperaje / CCA<input name="amp" value="${esc(item.amp||item.ah||"")}"></label>
 <label>Perfil<input name="profile" value="${esc(item.profile||"")}"></label>
 <label>Precio de compra<input name="cost" type="number" min="0" value="${esc(item.cost??0)}"></label>
 <label>Precio de venta<input name="price" type="number" min="0" value="${esc(item.price??0)}"></label>
 <label>Cantidad en inventario<input name="qty" type="number" min="0" value="${esc(item.qty??0)}"></label>
 <label>Proveedor<input name="supplier" value="${esc(item.supplier||"")}"></label>
 <label>Garantía<input name="warranty" value="${esc(item.warranty||"")}" placeholder="Ej.: 12 meses"></label>
 <label class="full">Aplicaciones / vehículos<input name="vehicles" value="${esc(item.vehicles||"")}" placeholder="Ej.: Toyota Yaris 2015-2020"></label>
 <div class="full actions"><button class="btn" type="submit">Guardar</button></div></form>`);
 document.getElementById("productForm").onsubmit=e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.id=item.id||Date.now();["qty","cost","price"].forEach(k=>o[k]=Number(o[k]||0));const i=db.inventory.findIndex(x=>x.id===o.id);if(i>=0)db.inventory[i]=o;else db.inventory.push(o);save();closeModal();inventory()};
}
function editProduct(id){openProduct(db.inventory.find(x=>x.id===id))}
function sales(){
 app.innerHTML=`<div class="page-title"><div><h1>Ventas</h1><div class="muted">Registro de ventas</div></div><button class="btn" onclick="openSale()">+ Nueva venta</button></div>
 <div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Batería</th><th>Cantidad</th><th>Total</th></tr></thead><tbody>${db.sales.length?db.sales.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.client)}</td><td>${esc(x.product)}</td><td>${x.qty}</td><td>₡${Number(x.total).toLocaleString("es-CR")}</td></tr>`).join(""):`<tr><td colspan="5" class="empty">Todavía no hay ventas.</td></tr>`}</tbody></table></div>`;
}
function openSale(){
 if(!db.inventory.length)return alert("Primero registre una batería en inventario.");
 modal("Registrar venta",`<form class="form" id="saleForm">
 <label class="full">Batería<select name="product" required>${db.inventory.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.brand)} ${esc(x.model)} — ₡${Number(x.price||0).toLocaleString("es-CR")}</option>`).join("")}</select></label>
 <label>Cliente<input name="client" value="Cliente contado"></label><label>Cantidad<input name="qty" type="number" min="1" value="1"></label>
 <div class="full actions"><button class="btn" type="submit">Guardar venta</button></div></form>`);
 document.getElementById("saleForm").onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),p=db.inventory.find(x=>x.id==f.get("product")),q=Number(f.get("qty"));if(q>p.qty)return alert("No hay suficiente existencia.");p.qty-=q;db.sales.push({date:new Date().toISOString().slice(0,10),client:f.get("client"),product:p.code,qty:q,total:q*Number(p.price||0)});save();closeModal();sales()};
}
function simpleSection(type,title,fields){
 const arr=db[type];app.innerHTML=`<div class="page-title"><div><h1>${title}</h1></div><button class="btn" onclick="openSimple('${type}','${title}')">+ Agregar</button></div>
 <div class="table-wrap"><table class="table"><thead><tr>${fields.map(f=>`<th>${f.label}</th>`).join("")}</tr></thead><tbody>${arr.length?arr.map(x=>`<tr>${fields.map(f=>`<td>${esc(x[f.key])}</td>`).join("")}</tr>`).join(""):`<tr><td colspan="${fields.length}" class="empty">No hay registros.</td></tr>`}</tbody></table></div>`;
}
function clients(){simpleSection("clients","Clientes",[{key:"name",label:"Nombre"},{key:"phone",label:"Teléfono"},{key:"vehicle",label:"Vehículo"},{key:"note",label:"Nota"}])}
function vehicles(){simpleSection("vehicles","Vehículos",[{key:"make",label:"Marca"},{key:"model",label:"Modelo"},{key:"year",label:"Año"},{key:"battery",label:"Batería"}])}
function warranties(){simpleSection("warranties","Garantías",[{key:"date",label:"Fecha"},{key:"client",label:"Cliente"},{key:"battery",label:"Batería"},{key:"status",label:"Estado"}])}
function openSimple(type,title){
 const specs={clients:[["name","Nombre"],["phone","Teléfono"],["vehicle","Vehículo"],["note","Nota"]],vehicles:[["make","Marca"],["model","Modelo"],["year","Año"],["battery","Batería"]],warranties:[["date","Fecha"],["client","Cliente"],["battery","Batería"],["status","Estado"]]}[type];
 modal(title,`<form class="form" id="simpleForm">${specs.map(([k,l])=>`<label>${l}<input name="${k}" ${k==="date"?"type=date":""} value="${k==="date"?new Date().toISOString().slice(0,10):""}"></label>`).join("")}<div class="full actions"><button class="btn">Guardar</button></div></form>`);
 document.getElementById("simpleForm").onsubmit=e=>{e.preventDefault();db[type].push(Object.fromEntries(new FormData(e.target)));save();closeModal();render(type==="clients"?"clientes":type==="vehicles"?"vehiculos":"garantias")};
}
function reports(){
 const revenue=db.sales.reduce((a,x)=>a+Number(x.total||0),0),cost=db.sales.reduce((a,x)=>{const p=db.inventory.find(y=>y.code===x.product);return a+x.qty*Number(p?.cost||0)},0);
 app.innerHTML=`<div class="page-title"><div><h1>Reportes</h1><div class="muted">Resumen de la operación</div></div></div>
 <div class="cards"><div class="card"><div class="muted">Ventas acumuladas</div><div class="metric">₡${revenue.toLocaleString("es-CR")}</div></div>
 <div class="card"><div class="muted">Costo estimado vendido</div><div class="metric">₡${cost.toLocaleString("es-CR")}</div></div>
 <div class="card"><div class="muted">Margen estimado</div><div class="metric">₡${(revenue-cost).toLocaleString("es-CR")}</div></div>
 <div class="card"><div class="muted">Clientes</div><div class="metric">${db.clients.length}</div></div></div>
 <div class="notice">Esta primera versión guarda los datos <b>en este dispositivo</b>. Antes de usarla como sistema definitivo agregaremos respaldo, usuarios y base de datos en la nube.</div>`;
}
function modal(title,body){document.getElementById("modalTitle").textContent=title;document.getElementById("modalBody").innerHTML=body;document.getElementById("modal").classList.remove("hidden")}
function closeModal(){document.getElementById("modal").classList.add("hidden")}
document.getElementById("closeModal").onclick=closeModal;
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};

/* ===== Funciones mejoradas ===== */
function formatCRC(v){return "₡"+Number(v||0).toLocaleString("es-CR")}
function splitApps(text){return String(text||"").split(/;\s*/).map(x=>x.trim()).filter(Boolean)}
function vehicleFits(appText,make,model,year){
 const hay=String(appText||"").toUpperCase();
 const mk=String(make||"").trim().toUpperCase(), md=String(model||"").trim().toUpperCase(), yr=Number(year||0);
 if(mk && !hay.includes(mk)) return false;
 if(md && !hay.includes(md)) return false;
 if(yr){
   const entries=splitApps(appText);
   const related=entries.filter(e=> (!mk||e.includes(mk)) && (!md||e.includes(md)) );
   if(related.length===0) return false;
   const hasYear=related.some(e=>{
     const m=e.match(/(19\d{2}|20\d{2})\s*-\s*(19\d{2}|20\d{2})/);
     if(!m) return e.includes(String(yr));
     return yr>=Number(m[1]) && yr<=Number(m[2]);
   });
   if(!hasYear) return false;
 }
 return true;
}
function vehicles(){
 app.innerHTML=`<div class="page-title"><div><h1>Vehículos</h1><div class="muted">Encuentra rápidamente la batería compatible con el vehículo.</div></div><button class="btn" onclick="openSimple('vehicles','Registrar vehículo')">+ Registrar vehículo</button></div>
 <div class="panel vehicle-search"><h3>🔎 Buscar batería por vehículo</h3><div class="search-grid">
 <label>Marca<input id="vMake" class="input" placeholder="Ej. Toyota"></label>
 <label>Modelo<input id="vModel" class="input" placeholder="Ej. Yaris"></label>
 <label>Año<input id="vYear" class="input" type="number" min="1950" max="2100" placeholder="Ej. 2008"></label>
 <button class="btn" id="vSearchBtn">Buscar</button></div>

 const run=()=>{const make=document.getElementById('vMake').value,model=document.getElementById('vModel').value,year=document.getElementById('vYear').value; const rows=db.inventory.filter(x=>vehicleFits(x.vehicles,make,model,year)); const box=document.getElementById('vehicleResults'); if(!make&&!model&&!year){box.innerHTML='<div class="muted">Escriba marca, modelo y/o año para mostrar coincidencias.</div>';return} if(!rows.length){box.innerHTML='<div class="notice">No encontré una aplicación registrada para esos datos.</div>';return} box.innerHTML=rows.slice(0,25).map(x=>`<div class="match-card"><div class="match-top"><div><b>${esc(x.code)}</b> — ${esc(x.brand)} ${esc(x.model)}</div><span class="tag">Stock: ${esc(x.qty)}</span></div><div class="specs"><span>${esc(x.voltage||'12V')}</span><span>${x.amp?esc(x.amp)+' CCA':''}</span><span>${esc(x.profile||'Perfil no indicado')}</span>${x.price?`<span>${formatCRC(x.price)}</span>`:''}</div><div class="fit">Aplicación encontrada: ${esc(splitApps(x.vehicles).find(e=>{const m=String(make||'').toUpperCase(),md=String(model||'').toUpperCase();return (!m||e.toUpperCase().includes(m))&&(!md||e.toUpperCase().includes(md))})||'Base de aplicaciones')}</div></div>`).join('')};
 document.getElementById('vSearchBtn').onclick=run; ['vMake','vModel','vYear'].forEach(id=>document.getElementById(id).addEventListener('input',run));
}
function openSimple(type,title){
 const specs={clients:[['name','Nombre'],['phone','Teléfono'],['vehicle','Vehículo'],['note','Nota']],vehicles:[['make','Marca'],['model','Modelo'],['year','Año'],['fuel','Combustible'],['battery','Batería']],warranties:[['date','Fecha'],['client','Cliente'],['battery','Batería'],['status','Estado']]}[type];
 modal(title,`<form class="form" id="simpleForm">${specs.map(([k,l])=>`<label>${l}<input name="${k}" ${k==='date'?'type=date':''} value="${k==='date'?new Date().toISOString().slice(0,10):''}"></label>`).join('')}<div class="full actions"><button class="btn">Guardar</button></div></form>`);
 document.getElementById('simpleForm').onsubmit=e=>{e.preventDefault();db[type]=db[type]||[];db[type].push(Object.fromEntries(new FormData(e.target)));save();closeModal();render(type==='clients'?'clientes':type==='vehicles'?'vehiculos':'garantias')};
}
function openSale(){
 if(!db.inventory.length)return alert('Primero registre una batería en inventario.');
 const available=db.inventory.filter(x=>Number(x.qty||0)>0);
 if(!available.length)return alert('No hay baterías con existencia disponible.');
 modal('Registrar venta',`<form class="form" id="saleForm">
 <label class="full">Batería<select name="product" required>${available.map(x=>`<option value="${x.id}">${esc(x.code)} — ${esc(x.brand)} ${esc(x.model)} — ${formatCRC(x.price)}</option>`).join('')}</select></label>
 <label>Cliente<input name="client" value="Cliente contado"></label><label>Teléfono<input name="phone" placeholder="6392 8294"></label>
 <label>Cantidad<input name="qty" type="number" min="1" value="1"></label>
 <div class="sale-extra"><div class="sale-extra-title">Datos del vehículo (para el certificado de garantía)</div><div class="form"><label>Marca<input name="vehicleMake" placeholder="Ej. Toyota"></label><label>Modelo<input name="vehicleModel" placeholder="Ej. Yaris"></label><label>Año<input name="vehicleYear" type="number" placeholder="Ej. 2008"></label><label>Combustible<select name="fuel"><option value="">No indicado</option><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Eléctrico</option></select></label></div></div>
 <div class="full actions"><button class="btn" type="submit">Guardar venta y generar garantía</button></div></form>`);
 document.getElementById('saleForm').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),p=db.inventory.find(x=>x.id==f.get('product')),q=Number(f.get('qty'));if(!p||q<1)return;if(q>Number(p.qty||0))return alert('No hay suficiente existencia.');p.qty-=q;const sale={id:Date.now(),date:new Date().toISOString().slice(0,10),client:f.get('client')||'Cliente contado',phone:f.get('phone')||'',product:p.code,productId:p.id,brand:p.brand,model:p.model,voltage:p.voltage||'12V',amp:p.amp||'',profile:p.profile||'',warranty:p.warranty||'',qty:q,total:q*Number(p.price||0),vehicle:{make:f.get('vehicleMake')||'',model:f.get('vehicleModel')||'',year:f.get('vehicleYear')||'',fuel:f.get('fuel')||''}};db.sales.push(sale);db.warranties=db.warranties||[];db.warranties.push({date:sale.date,client:sale.client,battery:sale.product,status:'Generada',saleId:sale.id});save();closeModal();sales();setTimeout(()=>openWarrantyReport(sale),50)};
}
function sales(){

 app.innerHTML=`<div class="page-title"><div><h1>Ventas</h1><div class="muted">Registro de ventas</div></div><button class="btn" onclick="openSale()">+ Nueva venta</button></div><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Batería</th><th>Cantidad</th><th>Total</th><th></th></tr></thead><tbody>${rows.length?rows.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.client)}</td><td>${esc(x.product)}</td><td>${esc(x.qty)}</td><td>${formatCRC(x.total)}</td><td><button class="btn secondary" onclick="openWarrantyReportById(${x.id})">Garantía</button> <button class="danger-link" onclick="deleteSale(${x.id})">Eliminar</button></td></tr>`).join(''):`<tr><td colspan="6" class="empty">Todavía no hay ventas.</td></tr>`}</tbody></table></div>`;
}
function deleteSale(id){
 const sale=db.sales.find(x=>x.id==id);if(!sale)return;if(!confirm('¿Eliminar esta venta y devolver la cantidad al inventario?'))return;const p=db.inventory.find(x=>x.id===(sale.productId||db.inventory.find(y=>y.code===sale.product)?.id));if(p)p.qty=Number(p.qty||0)+Number(sale.qty||0);db.sales=db.sales.filter(x=>x.id!=id);db.warranties=(db.warranties||[]).filter(w=>w.saleId!=id);save();sales();
}

function exportBackup(){const blob=new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),data:db},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='WRbateriasCR_respaldo.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importBackup(e){const file=e.target.files?.[0];if(!file)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!o.data||!Array.isArray(o.data.inventory))throw Error();if(!confirm('Esto reemplazará los datos actuales de la aplicación. ¿Continuar?'))return;db=o.data;db.sales=db.sales||[];db.clients=db.clients||[];db.vehicles=db.vehicles||[];db.warranties=db.warranties||[];save();alert('Respaldo restaurado correctamente.');render('inicio')}catch(err){alert('El archivo de respaldo no es válido.')}};r.readAsText(file)}

function norm(t){return String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim()}
function vehicleSearchRows(make,model,year){
 const mk=norm(make), md=norm(model), y=Number(year||0);
 if(!mk&&!md&&!y)return [];
 const apps=APLICACIONES_VEHICULOS.filter(a=>{
   const am=norm(a.make), ao=norm(a.model);
   if(mk&&!am.includes(mk))return false;
   if(md&&!ao.includes(md))return false;
   if(y&&(!(Number(a.y1)||0)<=y || y>(Number(a.y2)||9999)))return false;
   return true;
 });
 const bcis=new Set();
 apps.forEach(a=>[a.b1,a.b2].forEach(v=>String(v||'').split(/[\/ ,;-]+/).map(norm).filter(Boolean).forEach(x=>bcis.add(x))));
 const rows=CATALOGO_MAESTRO.filter(x=>{
   const b=norm(x.bci); if(!b)return false;
   return [...bcis].some(q=>b===q || b.includes(q) || q.includes(b));
 });
 return rows.map(x=>{
   const inv=(db.inventory||[]).find(i=>norm(i.code)===norm(x.model)||norm(i.model)===norm(x.model));
   return {...x,qty:Number(inv?.qty||0),price:Number(inv?.price||0)};
 });
}

   WRbateriasCR - REVISION OPERATIVA 2026-09
   Inventario, precio mínimo, movimientos de stock y reportes.
   IVA general configurable (13% por defecto) + margen 40% por defecto.

function wrNormalizeData(){
  db = db && typeof db === 'object' ? db : {};
  db.inventory = Array.isArray(db.inventory) ? db.inventory : [];
  db.sales = Array.isArray(db.sales) ? db.sales : [];
  db.clients = Array.isArray(db.clients) ? db.clients : [];
  db.vehicles = Array.isArray(db.vehicles) ? db.vehicles : [];
  db.warranties = Array.isArray(db.warranties) ? db.warranties : [];
  db.inventory = db.inventory.map((x,i)=>({
    id: x.id ?? (Date.now()+i), code:String(x.code||''), brand:String(x.brand||''), model:String(x.model||''),
    voltage:String(x.voltage||'12V'), amp:x.amp??x.ah??'', profile:String(x.profile||''),
    cost:Number(x.cost||0), price:Number(x.price||0), qty:Number(x.qty||0), supplier:String(x.supplier||''),
    warranty:String(x.warranty||''), vehicles:String(x.vehicles||''), ivaRate:Number(x.ivaRate??13), markupRate:Number(x.markupRate??40)
  }));
  db.sales = db.sales.map(x=>({...x, qty:Number(x.qty||0), unitPrice:Number(x.unitPrice ?? (x.qty ? Number(x.total||0)/Number(x.qty) : 0)), unitCost:Number(x.unitCost||0), total:Number(x.total||0)}));
}
wrNormalizeData();
save();

function wrPriceMinimum(cost, ivaRate, markupRate){
  const c=Number(cost||0), iva=Number(ivaRate||0)/100, margin=Number(markupRate||0)/100;
  return Math.round(c*(1+iva)*(1+margin));
}
function wrSetStock(id, delta){
  const p=db.inventory.find(x=>String(x.id)===String(id));
  if(!p)return;
  const next=Math.max(0,Number(p.qty||0)+Number(delta||0));
  p.qty=next; save(); inventory();
}
function wrAdjustStock(id){
  const p=db.inventory.find(x=>String(x.id)===String(id)); if(!p)return;
  const value=prompt(`Existencia actual: ${p.qty}\nDigite la nueva cantidad:` , String(p.qty));
  if(value===null)return;
  const n=Number(value);
  if(!Number.isFinite(n)||n<0||!Number.isInteger(n)){alert('Ingrese una cantidad entera válida.');return;}
  p.qty=n; save(); inventory();
}

  recalc();

}

/* =========================================================
   WRbateriasCR - REVISION OPERATIVA 2026-09
   Inventario, precio mínimo, movimientos de stock y reportes.
   IVA general configurable (13% por defecto) + margen 40% por defecto.

function wrNormalizeData(){
  db = db && typeof db === 'object' ? db : {};
  db.inventory = Array.isArray(db.inventory) ? db.inventory : [];
  db.sales = Array.isArray(db.sales) ? db.sales : [];
  db.clients = Array.isArray(db.clients) ? db.clients : [];
  db.vehicles = Array.isArray(db.vehicles) ? db.vehicles : [];
  db.warranties = Array.isArray(db.warranties) ? db.warranties : [];
  db.inventory = db.inventory.map((x,i)=>({
    id: x.id ?? (Date.now()+i), code:String(x.code||''), brand:String(x.brand||''), model:String(x.model||''),
    voltage:String(x.voltage||'12V'), amp:x.amp??x.ah??'', profile:String(x.profile||''),
    cost:Number(x.cost||0), price:Number(x.price||0), qty:Number(x.qty||0), supplier:String(x.supplier||''),
    warranty:String(x.warranty||''), vehicles:String(x.vehicles||''), ivaRate:Number(x.ivaRate??13), markupRate:Number(x.markupRate??40)
  }));
  db.sales = db.sales.map(x=>({...x, qty:Number(x.qty||0), unitPrice:Number(x.unitPrice ?? (x.qty ? Number(x.total||0)/Number(x.qty) : 0)), unitCost:Number(x.unitCost||0), total:Number(x.total||0)}));
}
wrNormalizeData();
save();

function wrPriceMinimum(cost, ivaRate, markupRate){
  const c=Number(cost||0), iva=Number(ivaRate||0)/100, margin=Number(markupRate||0)/100;
  return Math.round(c*(1+iva)*(1+margin));
}
function wrSetStock(id, delta){
  const p=db.inventory.find(x=>String(x.id)===String(id));
  if(!p)return;
  const next=Math.max(0,Number(p.qty||0)+Number(delta||0));
  p.qty=next; save(); inventory();
}
function wrAdjustStock(id){
  const p=db.inventory.find(x=>String(x.id)===String(id)); if(!p)return;
  const value=prompt(`Existencia actual: ${p.qty}\nDigite la nueva cantidad:` , String(p.qty));
  if(value===null)return;
  const n=Number(value);
  if(!Number.isFinite(n)||n<0||!Number.isInteger(n)){alert('Ingrese una cantidad entera válida.');return;}
  p.qty=n; save(); inventory();
}

  const form=document.getElementById('productForm'), cost=document.getElementById('wrCost'), ivaEl=document.getElementById('wrIva'), markEl=document.getElementById('wrMarkup'), sug=document.getElementById('wrSuggested'), price=document.getElementById('wrPrice');

  recalc();

}

<label class="full">Observación<input name="note"></label><div class="full actions"><button class="btn">Guardar venta y generar garantía</button></div></form>`);

function wrVehicleFind(make,model,year,fuel){
  const aliases={CHEVY:"Chevrolet",CHEVROLET:"Chevrolet",VW:"Volkswagen"};
  const mk=aliases[norm(make)]||Object.keys(WR_VEHICLE_CATALOG).find(k=>norm(k)===norm(make));
  if(!mk)return null;
  const models=WR_VEHICLE_CATALOG[mk];
  const key=Object.keys(models).find(k=>norm(k)===norm(model));
  if(!key)return null;
  const d=models[key], y=Number(year||0);
  if(y && (y<d[0]||y>d[1]))return {make:mk,model:key,range:[d[0],d[1]],fuel:d[2].split('|'),battery:d[3],note:d[4],yearMismatch:true};
  if(fuel && !d[2].split('|').includes(fuel))return {make:mk,model:key,range:[d[0],d[1]],fuel:d[2].split('|'),battery:d[3],note:d[4],fuelMismatch:true};
  return {make:mk,model:key,range:[d[0],d[1]],fuel:d[2].split('|'),battery:d[3],note:d[4]};
}

/* =========================================================
   WRbateriasCR — BLOQUE FINAL DE CONTROL Y CONTABILIDAD
   Este bloque se ejecuta al final para evitar que versiones
   anteriores de funciones sobrescriban estas funciones.
========================================================= */
(function(){
  const wrToday=()=>new Date().toISOString().slice(0,10);
  const wrMoney=n=>formatCRC(Number(n||0));
  const wrEsc=typeof esc==="function"?esc:(x)=>String(x??"");
  function wrInitAccounting(){
    db.expenses=Array.isArray(db.expenses)?db.expenses:[];
    db.expenses=db.expenses.map((x,i)=>({
      id:x.id??(Date.now()+i), date:String(x.date||wrToday()),
      description:String(x.description||""), category:String(x.category||"Otros"),
      amount:Number(x.amount||0), note:String(x.note||"")
    }));
    db.sales=(db.sales||[]).map((x,i)=>({
      ...x, id:x.id??(Date.now()+i),
      date:String(x.date||wrToday()),
      qty:Number(x.qty||0), total:Number(x.total||0),
      unitPrice:Number(x.unitPrice??(x.qty?Number(x.total||0)/Number(x.qty):0)),
      unitCost:Number(x.unitCost||0)
    }));
    save();
  }

  /* ---------- BCI / APLICACIÓN EXACTA ---------- */
  function wrBciFromApplication(make,model,year){
    if(!Array.isArray(window.APLICACIONES_VEHICULOS) && typeof APLICACIONES_VEHICULOS==="undefined") return null;
    const rows=(typeof APLICACIONES_VEHICULOS!=="undefined"?APLICACIONES_VEHICULOS:[]);
    const aliases={CHEVY:"CHEVROLET",CHEVROLET:"CHEVROLET",VW:"VOLKSWAGEN"};
    const nm=v=>norm(String(v||"")).toUpperCase();
    const mk=aliases[nm(make)]||nm(make);
    const mo=nm(model);
    const y=Number(year||0);
    const hits=rows.filter(r=>{
      const rm=nm(r.make), rmo=nm(r.model);
      return rm===mk && (rmo===mo || rmo.includes(mo) || mo.includes(rmo)) &&
        (!y || (y>=Number(r.y1)&&y<=Number(r.y2)));
    });
    if(!hits.length)return null;
    const groups=[...new Set(hits.flatMap(r=>[r.b1,r.b2]).filter(x=>x&&x!=="-"))];
    return {groups,rows:hits,source:"Catálogo de aplicaciones cargado en WRbateriasCR"};
  }

  function wrBCI(make,model,year,battery){
    const exact=wrBciFromApplication(make,model,year);
    if(exact && exact.groups.length) return {
      value:exact.groups.join(" / "),
      status:"exacto",
      note:"Grupo BCI obtenido de una aplicación que coincide con marca, modelo y año."
    };

    const mk=norm(make), mo=norm(model), y=Number(year||0);
    /* Aplicaciones verificadas externamente para Chevrolet Cruze.
       Se mantiene separada del catálogo genérico para no inventar equivalencias. */
    if((mk==="chevrolet"||mk==="chevy") && mo==="cruze" && y>=2011 && y<=2015)
      return {value:"47 (H5)",status:"verificado",note:"Aplicación publicada para Cruze 2011–2015; confirmar motor/configuración antes de vender."};
    if((mk==="chevrolet"||mk==="chevy") && mo==="cruze" && y>=2016 && y<=2019)
      return {value:"48 (H6)",status:"verificado",note:"Aplicación publicada para Cruze 2016–2019; algunas configuraciones admiten 94R/H7."};

    const b=String(battery||"").toUpperCase();
    /* Solo devolver BCI si el propio código ya es un grupo BCI,
       nunca convertir N-50/N-70 a un BCI arbitrario. */
    const m=b.match(/\b(94R|H7|48|H6|47|H5|42|41|40R|40|35|34\/78|34|27F|27|24R|24|22F|31|65|58|51R|51|75\/86)\b/);
    if(m) return {value:m[1],status:"por código",note:"Grupo BCI identificado por el código de batería; confirmar dimensiones y polaridad."};
    return {value:"No determinado",status:"no-verificado",note:"El formato JIS indicado no permite asignar un único grupo BCI sin una aplicación exacta. No se inventa equivalencia."};
  }

  /* ---------- VEHÍCULOS: resultado con BCI ---------- */
  window.wrVehicleSearch=function(){
    const make=document.getElementById('wrVMake')?.value||"";
    const model=document.getElementById('wrVModel')?.value||"";
    const year=document.getElementById('wrVYear')?.value||"";

    const box=document.getElementById('wrVehicleResult');
    if(!box)return;    if(!make||!model){box.innerHTML='<div class="notice">Ingrese marca y modelo.</div>';return}
    const r=wrVehicleFind(make,model,year,fuel);
    if(!r){box.innerHTML='<div class="notice"><b>No encontramos una aplicación exacta.</b><br>No se mostrará un grupo BCI inventado.</div>';return}
    const bci=wrBCI(r.make,r.model,year,r.battery);
    let extra="";
    if(r.yearMismatch)extra+='<div class="notice">El año está fuera del rango del catálogo. No se considera una coincidencia exacta.</div>';
    if(r.fuelMismatch)extra+='<div class="notice">El combustible indicado no coincide con la aplicación registrada.</div>';
    const bciClass=bci.status==="no-verificado"?"bci-warn":"bci-ok";
    const msg='Hola WRbateriasCr, quiero confirmar batería para '+r.make+' '+r.model+(year?' '+year:'')+(fuel?' '+fuel:'')+'. BCI mostrado: '+bci.value+'. Referencia: '+r.battery+'.';
    box.innerHTML=`<div class="vehicle-hit"><h3>🔋 ${wrEsc(r.make)} ${wrEsc(r.model)}</h3>
      <div class="bci-result ${bciClass}"><span>GRUPO BCI</span><strong>${wrEsc(bci.value)}</strong><small>${wrEsc(bci.note)}</small></div>
      <div class="bateria-recomendada">${wrEsc(r.battery)}</div>
      <p><b>Años registrados:</b> ${r.range[0]}–${r.range[1]}</p>
      <p><b>Combustible registrado:</b> ${wrEsc(r.fuel.join(', '))}</p>
      <p><b>Nota:</b> ${wrEsc(r.note)}</p>${extra}
      <p class="nota"><b>Regla de seguridad:</b> cuando no exista una aplicación BCI exacta, la app indicará “No determinado” en vez de convertir automáticamente un código JIS a BCI.</p>
      
    </div>`;
  };

  /* ---------- VENTAS: fecha manual + datos contables ---------- */
  window.openSale=function(){
    const a=db.inventory.filter(x=>Number(x.qty||0)>0);

      <label class="full">Batería<select name="product">${a.map(x=>`<option value="${wrEsc(x.id)}">${wrEsc(x.code)} — ${wrEsc(x.brand)} ${wrEsc(x.model)} — Stock ${x.qty} — ${formatCRC(x.price)}</option>`).join("")}</select></label>
      <label>Cliente<input name="client" value="Cliente contado"></label><label>Teléfono<input name="phone"></label>

      <label>Método de pago<select name="payment"><option>Contado</option><option>Sinpe</option><option>Tarjeta</option><option>Transferencia</option><option>Otro</option></select></label>
      <label>Marca vehículo<input name="vehicleMake"></label><label>Modelo vehículo<input name="vehicleModel"></label>
      <label>Año<input name="vehicleYear" type="number" min="1980" max="2026"></label>
      <label>Combustible<select name="fuel"><option value="">No indicado</option><option>Gasolina</option><option>Diésel</option><option>Híbrido</option><option>Eléctrico</option></select></label>
      <label class="full">Observación<input name="note"></label>
      <div class="full actions"><button class="btn">Guardar venta y generar garantía</button></div>
    </form>`);
    const f=document.getElementById("saleForm"),sel=f.elements.product,price=f.elements.unitPrice;
    const sync=()=>{const p=db.inventory.find(x=>String(x.id)===String(sel.value));price.value=Number(p?.price||0)};
    sel.onchange=sync;sync();
    f.onsubmit=e=>{
      e.preventDefault();const d=new FormData(f),p=db.inventory.find(x=>String(x.id)===String(d.get("product")));
      const q=Number(d.get("qty")),up=Number(d.get("unitPrice"));
      if(!p||q<1||!Number.isInteger(q)||q>Number(p.qty||0))return alert("Cantidad inválida o insuficiente.");
      if(!Number.isFinite(up)||up<0)return alert("Precio unitario inválido.");
      const id=Date.now();
      const sale={id,date:String(d.get("date")||wrToday()),client:d.get("client")||"Cliente contado",phone:d.get("phone")||"",
        product:p.code,productId:p.id,brand:p.brand,model:p.model,voltage:p.voltage||"12V",amp:p.amp||"",
        unitCost:Number(p.cost||0),unitPrice:up,total:q*up,qty:q,warranty:d.get("warranty")||p.warranty||"Por definir",
        payment:d.get("payment")||"",ivaRate:Number(d.get("ivaRate")||13),note:d.get("note")||"",

      p.qty-=q;db.sales.push(sale);db.warranties.push({id:id+1,date:sale.date,client:sale.client,battery:sale.product,status:"Generada",saleId:id});
      save();closeModal();sales();setTimeout(()=>openWarrantyReportById(id),50);
    };

  /* ---------- GASTOS ---------- */
  window.openExpense=function(){

      <label>Categoría<select name="category"><option>Combustible</option><option>Publicidad</option><option>Transporte</option><option>Herramientas</option><option>Servicios</option><option>Alquiler</option><option>Impuestos</option><option>Otros</option></select></label>
      <label class="full">Descripción<input name="description" required placeholder="Ej.: Compra de material"></label>

      <div class="full actions"><button class="btn">Guardar gasto</button></div>
    </form>`);
    document.getElementById("expenseForm").onsubmit=e=>{

  window.deleteExpense=function(id){
    const x=db.expenses.find(e=>String(e.id)===String(id));if(!x)return;

    db.expenses=db.expenses.filter(e=>String(e.id)!==String(id));save();accounting();
  };

  /* ---------- CONTABILIDAD / VENTAS POR FECHA ---------- */
  window.accounting=function(){
    wrInitAccounting();
    const sales=db.sales||[], expenses=db.expenses||[];
    const min=sales.reduce((m,x)=>!m||x.date<m?x.date:m,"");
    const max=sales.reduce((m,x)=>!m||x.date>m?x.date:m,"");
    app.innerHTML=`<div class="page-title"><div><h1>Contabilidad</h1><div class="muted">Ventas por fecha, costo, utilidad, IVA estimado y gastos.</div></div>

      <div class="panel">
        <h3>📅 Ventas por fechas</h3>
        <div class="date-filter">
          <label>Desde<input id="accFrom" type="date" value="${min||wrToday()}"></label>
          <label>Hasta<input id="accTo" type="date" value="${max||wrToday()}"></label>
          <button class="btn" onclick="renderAccountingPeriod()">Consultar</button>
          <button class="btn secondary" onclick="setAccountingToday()">Hoy</button>
          <button class="btn secondary" onclick="setAccountingMonth()">Este mes</button>
        </div>
      </div>
      <div id="accBody"></div>`;
    renderAccountingPeriod();
  };

  window.setAccountingToday=function(){document.getElementById("accFrom").value=wrToday();document.getElementById("accTo").value=wrToday();renderAccountingPeriod()};
  window.setAccountingMonth=function(){const d=new Date(),from=new Date(d.getFullYear(),d.getMonth(),1).toISOString().slice(0,10);document.getElementById("accFrom").value=from;document.getElementById("accTo").value=wrToday();renderAccountingPeriod()};

  window.renderAccountingPeriod=function(){
    wrInitAccounting();
    const from=document.getElementById("accFrom")?.value||"1980-01-01",to=document.getElementById("accTo")?.value||"2999-12-31";
    if(from>to){alert("La fecha Desde no puede ser mayor que Hasta.");return}
    const ss=db.sales.filter(x=>String(x.date)>=from&&String(x.date)<=to);
    const es=db.expenses.filter(x=>String(x.date)>=from&&String(x.date)<=to);
    const revenue=ss.reduce((a,x)=>a+Number(x.total||0),0);
    const cost=ss.reduce((a,x)=>a+Number(x.qty||0)*Number(x.unitCost||0),0);
    const gross=revenue-cost;
    const expenseTotal=es.reduce((a,x)=>a+Number(x.amount||0),0);
    const net=gross-expenseTotal;
    const iva=ss.reduce((a,x)=>{const rate=Number(x.ivaRate??13)/100;return a+(rate>0?Number(x.total||0)-Number(x.total||0)/(1+rate):0)},0);

    const expRows=es.slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))).map(x=>`<tr><td>${wrEsc(x.date)}</td><td>${wrEsc(x.category)}</td><td>${wrEsc(x.description)}</td><td>${wrMoney(x.amount)}</td><td><button class="danger-link" onclick="deleteExpense(${x.id})">Eliminar</button></td></tr>`).join("");
    const dayRows=daily.map(([date,v])=>`<tr><td>${date}</td><td>${v.units}</td><td>${wrMoney(v.revenue)}</td><td>${wrMoney(v.cost)}</td><td>${wrMoney(v.revenue-v.cost)}</td></tr>`).join("");

    document.getElementById("accBody").innerHTML=`<div class="cards">
      <div class="card"><div class="muted">Ventas</div><div class="metric">${wrMoney(revenue)}</div></div>

      <div class="card"><div class="muted">Utilidad bruta</div><div class="metric">${wrMoney(gross)}</div></div>

      <div class="card"><div class="muted">IVA estimado incluido en ventas</div><div class="metric">${wrMoney(iva)}</div></div>
    </div>
    <div class="panel"><h3>📊 Resumen diario</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Unidades</th><th>Ventas</th><th>Costo</th><th>Utilidad bruta</th></tr></thead><tbody>${dayRows||'<tr><td colspan="5" class="empty">No hay ventas en este período.</td></tr>'}</tbody></table></div></div>
    <div class="panel"><h3>🧾 Detalle de ventas</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Batería</th><th>Vehículo</th><th>Cant.</th><th>Unitario</th><th>Total</th><th>Costo</th><th>Utilidad</th></tr></thead><tbody>${rows||'<tr><td colspan="9" class="empty">No hay ventas en este período.</td></tr>'}</tbody></table></div></div>

    <div class="panel"><h3>💸 Gastos</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th></th></tr></thead><tbody>${expRows||'<tr><td colspan="5" class="empty">No hay gastos en este período.</td></tr>'}</tbody></table></div></div>`;
  };

<script>
/* ===== CORRECCIÓN FINAL: CLIENTES DESDE VENTAS + CHEVROLET CRUZE BCI 47 ===== */
(function(){
  function wrSyncClientsFromSales(){
    db.clients = Array.isArray(db.clients) ? db.clients : [];
    const sales = Array.isArray(db.sales) ? db.sales : [];
    const key = x => {
      const phone=String(x.phone||"").replace(/\D/g,"");
      const name=String(x.client||x.name||"").trim().toUpperCase();
      return phone ? "P:"+phone : (name ? "N:"+name : "");
    };

    const map=new Map();
    db.clients.forEach(c=>{
      const k=key(c);
      if(k) map.set(k,{...c});
    });

    sales.forEach(v=>{
      const name=String(v.client||"").trim();
      const phone=String(v.phone||"").trim();
      if(!name && !phone) return;
      const k=key(v);
      if(!k)return;
      const veh=v.vehicle||{};
      const old=map.get(k)||{};
      map.set(k,{
        ...old,
        name:name||old.name||"Cliente contado",
        phone:phone||old.phone||"",
        vehicle:[veh.make,veh.model,veh.year].filter(Boolean).join(" ") || old.vehicle || "",
        note:old.note||"Cliente registrado automáticamente desde ventas.",
        lastSaleDate:v.date||old.lastSaleDate||""
      });
    });

    db.clients=Array.from(map.values());
    save();
    return db.clients;
  }

  /* Recalcular clientes al abrir la sección: cada cliente de ventas queda registrado. */
  window.clients=function(){
    const arr=wrSyncClientsFromSales();
    app.innerHTML=`<div class="page-title">
      <div><h1>Clientes</h1><div class="muted">${arr.length} cliente${arr.length===1?"":"s"} registrado${arr.length===1?"":"s"}</div></div>
      <button class="btn" onclick="openSimple('clients','Clientes')">+ Agregar</button>
    </div>
    <div class="table-wrap"><table class="table">
      <thead><tr><th>Nombre</th><th>Teléfono</th><th>Vehículo</th><th>Última venta</th><th>Nota</th></tr></thead>
      <tbody>${arr.length?arr.map(x=>`<tr>
        <td>${esc(x.name||"")}</td>
        <td>${esc(x.phone||"")}</td>
        <td>${esc(x.vehicle||"")}</td>
        <td>${esc(x.lastSaleDate||"")}</td>
        <td>${esc(x.note||"")}</td>
      </tr>`).join(""):`<tr><td colspan="5" class="empty">No hay clientes registrados.</td></tr>`}</tbody>
    </table></div>`;
  };

  /* Chevrolet Cruze: para 2011–2015 la referencia BCI usada por la app es 47/H5.
     Se evalúa antes de las aplicaciones genéricas para evitar que N-50/N-70 o una
     fila genérica oculten el grupo BCI. */
  const oldBCI=window.wrBCI;
  window.wrBCI=function(make,model,year,battery){
    const mk=String(make||"").trim().toUpperCase();
    const mo=String(model||"").trim().toUpperCase();
    const y=Number(year||0);
    const isCruze=(mk==="CHEVROLET"||mk==="CHEVY") && mo==="CRUZE";
    if(isCruze && y>=2011 && y<=2015){
      return {
        value:"47 (H5)",
        status:"verificado",
        note:"Chevrolet Cruze 2011–2015: Grupo BCI 47 (H5). Confirmar motor/configuración antes de vender."
      };
    }
    return oldBCI ? oldBCI(make,model,year,battery) : {value:"No determinado",status:"no-verificado",note:"Aplicación no verificada."};
  };

  /* Sincronizar al cargar, para que Inicio/Reportes también vean el número correcto. */
  wrSyncClientsFromSales();
})();
</script>


<script>
/* ===== REVISION GENERAL BCI v2026-09-18 =====
   Unifica el buscador de vehículos con la tabla de aplicaciones BCI.
   Evita que el catálogo genérico JIS (N-50/N-70/etc.) tape un BCI verificado.
*/
(function(){
  const oldFind=window.wrVehicleFind;
  const oldSearch=window.wrVehicleSearch;
  const N=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
  const ALIAS={CHEVY:'CHEVROLET',VW:'VOLKSWAGEN',TOYOTA:'TOYOTA'};
  const makeKey=v=>ALIAS[N(v)]||N(v);
  const modelKey=v=>N(v);

  // Aplicaciones BCI verificadas añadidas por revisión. No son conversiones JIS.
  const VERIFIED_BCI=[
    {make:'TOYOTA',model:'TERCEL',y1:1991,y2:1999,groups:['25'],note:'Toyota Parts & Service: Tercel 1991–1999, todos los modelos: BCI 25.'},
    {make:'CHEVROLET',model:'CRUZE',y1:2011,y2:2015,groups:['47'],note:'Aplicación publicada para Cruze 2011–2015: BCI 47/H5.'},
    {make:'CHEVROLET',model:'CRUZE',y1:2016,y2:2019,groups:['48'],note:'Aplicación publicada para Cruze 2016–2019: BCI 48/H6; algunas configuraciones pueden usar 94R/H7.'},
    {make:'HYUNDAI',model:'TUCSON',y1:2010,y2:2015,groups:['124R'],note:'Aplicaciones publicadas para Tucson 2010–2015 muestran BCI 124R; confirmar mercado, motor y polaridad en unidades importadas.'}
  ];

  function appHits(make,model,year){
    const mk=makeKey(make), mo=modelKey(model), y=Number(year||0);
    const rows=(typeof APLICACIONES_VEHICULOS!=='undefined' && Array.isArray(APLICACIONES_VEHICULOS))?APLICACIONES_VEHICULOS:[];
    const hits=rows.filter(r=>{
      const rm=makeKey(r.make), rmo=modelKey(r.model);
      const modelMatch=rmo===mo || rmo.includes(mo) || mo.includes(rmo);
      return rm===mk && modelMatch && (!y || (y>=Number(r.y1)&&y<=Number(r.y2)));
    });
    if(hits.length)return hits;
    return VERIFIED_BCI.filter(r=>r.make===mk && r.model===mo && (!y || (y>=r.y1&&y<=r.y2)));
  }

  function groupsFromHits(hits){
    const out=[];
    for(const r of hits||[]){
      const vals=r.groups||[r.b1,r.b2];
      for(const v of vals||[]){
        const g=String(v||'').trim();
        if(g&&g!=='-'&&!out.includes(g))out.push(g);
      }
    }
    return out;
  }

  function appRecord(make,model,year){
    const hits=appHits(make,model,year);
    if(!hits.length)return null;
    const groups=groupsFromHits(hits);
    if(!groups.length)return null;
    const y=Number(year||0);
    const first=hits[0];
    const y1=Math.min(...hits.map(x=>Number(x.y1)||y||0).filter(Boolean));
    const y2=Math.max(...hits.map(x=>Number(x.y2)||y||0).filter(Boolean));
    const fuels=['Gasolina','Diésel'];
    return {groups,hits,range:[y1,y2],fuel:fuels,note:first.note||first.noteText||'Grupo BCI tomado de la tabla de aplicaciones.'};
  }

  // Esta función pasa a ser la única fuente del grupo BCI del buscador.
  window.wrBCI=function(make,model,year,battery){
    const rec=appRecord(make,model,year);
    if(rec) return {value:rec.groups.join(' / '),status:'verificado',note:rec.note};
    // Si la referencia de batería ya es explícitamente BCI, se puede mostrar.
    const b=N(battery);
    const m=b.match(/\b(94R|124R|96R|75\/86|48\/91|34\/78|51R|42R|40R|27F|24R|22F|31T|31P|35|34|42|47|48|49|51|58|65|75|78|86|99|24|25|26|27|31|41|42|47|48|94R|H5|H6|H7)\b/);
    if(m){
      const v=m[1].replace(/^H5$/,'47').replace(/^H6$/,'48').replace(/^H7$/,'94R');
      return {value:v,status:'por-codigo',note:'Grupo BCI identificado directamente en la referencia.'};
    }
    return {value:'BCI no verificado',status:'no-verificado',note:'No existe una aplicación BCI verificable para esta combinación en la base instalada. No se convierte N-50/N-70 automáticamente.'};
  };

  // Si el catálogo general no conoce el vehículo, buscar directamente en las aplicaciones BCI.
  window.wrVehicleFind=function(make,model,year,fuel){
    const rec=appRecord(make,model,year);
    if(rec){
      const mk=String(make||'').trim().toUpperCase();
      const md=String(model||'').trim();
      return {make:(ALIAS[N(make)]||make),model:md,range:rec.range,fuel:rec.fuel,battery:rec.groups.join(' / '),note:rec.note,yearMismatch:false,fuelMismatch:false,fromBCI:true};
    }
    const r=oldFind?oldFind(make,model,year,fuel):null;
    return r;
  };

  window.wrVehicleSearch=function(){
    const make=document.getElementById('wrVMake')?.value||'';
    const model=document.getElementById('wrVModel')?.value||'';
    const year=document.getElementById('wrVYear')?.value||'';
    const fuel=document.getElementById('wrVFuel')?.value||'';
    const box=document.getElementById('wrVehicleResult');
    if(!box)return;
    if(!make||!model){box.innerHTML='<div class="notice">Ingrese marca y modelo.</div>';return;}
    const r=window.wrVehicleFind(make,model,year,fuel);
    if(!r){box.innerHTML='<div class="notice"><b>No encontramos una aplicación en la base BCI instalada.</b><br>Agregue la aplicación exacta antes de vender.</div>';return;}
    const bci=window.wrBCI(r.make,r.model,year,r.battery);
    const cls=bci.status==='no-verificado'?'bci-warn':'bci-ok';
    let extra='';
    if(r.yearMismatch)extra+='<div class="notice">El año está fuera del rango registrado ('+r.range[0]+'–'+r.range[1]+').</div>';
    if(r.fuelMismatch)extra+='<div class="notice">El combustible indicado no coincide con la aplicación registrada.</div>';
    const msg='Hola WRbateriasCr, quiero confirmar batería para '+r.make+' '+r.model+(year?' '+year:'')+(fuel?' '+fuel:'')+'. Grupo BCI mostrado: '+bci.value+'. Referencia: '+r.battery+'.';
    box.innerHTML='<div class="vehicle-hit"><h3>🔋 '+esc(r.make)+' '+esc(r.model)+'</h3>'+      '<div class="bci-result '+cls+'"><span>GRUPO BCI</span><strong>'+esc(bci.value)+'</strong><small>'+esc(bci.note)+'</small></div>'+      '<div class="bateria-recomendada">'+esc(r.battery)+'</div>'+      '<p><b>Años registrados:</b> '+r.range[0]+'–'+r.range[1]+'</p>'+      '<p><b>Combustible registrado:</b> '+esc((r.fuel||[]).join(', '))+'</p>'+      '<p><b>Nota:</b> '+esc(r.note||'')+'</p>'+extra+      '<p class="nota"><b>Importante:</b> el BCI se muestra desde una aplicación registrada; en vehículos importados o con diferentes motores/mercados debe comprobarse polaridad, dimensiones, CCA y la batería instalada.</p>'+      '</div>';
  };

  // Sincroniza los resultados del buscador antiguo con la nueva lógica al abrir Vehículos.
  const oldVehicles=window.vehicles;
  window.vehicles=function(){
    if(typeof oldVehicles==='function') oldVehicles();
  };
})();
</script>


<script>
/* ===== REVISIÓN FINAL: CCA EN VENTAS + EDITAR VENTAS + CONTABILIDAD POR FECHA ===== */
(function(){
  const today=()=>new Date().toLocaleDateString('en-CA');
  const money=n=>typeof formatCRC==='function'?formatCRC(Number(n||0)):('₡'+Number(n||0).toLocaleString('es-CR'));
  const esc2=typeof esc==='function'?esc:(x)=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  const normDate=v=>{
    const s=String(v??'').trim();
    if(!s)return today();
    const m=s.match(/^(\d{4}-\d{2}-\d{2})/);
    return m?m[1]:s;
  };
  const num=v=>Number.isFinite(Number(v))?Number(v):0;

  function normalizeSalesDates(){
    db.sales=Array.isArray(db.sales)?db.sales:[];
    db.sales.forEach(s=>{
      s.date=normDate(s.date);
      s.qty=num(s.qty);
      s.unitPrice=num(s.unitPrice);
      s.total=(s.total!==undefined&&s.total!=='')?num(s.total):s.qty*s.unitPrice;
      s.unitCost=num(s.unitCost);
      s.amp=s.amp??'';
    });
  }

  window.openSaleEdit=function(id){
    normalizeSalesDates();
    const s=db.sales.find(x=>String(x.id)===String(id));
    if(!s){alert('No se encontró la venta.');return;}
    const products=db.inventory||[];
    const currentProduct=products.find(p=>String(p.id)===String(s.productId))||products.find(p=>String(p.code)===String(s.product));
    const options=products.map(p=>`<option value="${esc2(p.id)}" ${currentProduct&&String(p.id)===String(currentProduct.id)?'selected':''}>${esc2(p.code)} — ${esc2(p.brand)} ${esc2(p.model)} — CCA ${esc2(p.amp||'No indicado')} — Stock ${p.qty}</option>`).join('');
    modal('Modificar venta',`<form class="form" id="editSaleForm">
      <label>Fecha de venta<input name="date" type="date" value="${esc2(normDate(s.date))}" required></label>
      <label class="full">Batería<select name="product">${options}</select></label>
      <label>Cliente<input name="client" value="${esc2(s.client||'Cliente contado')}"></label>
      <label>Teléfono<input name="phone" value="${esc2(s.phone||'')}"></label>
      <label>Cantidad<input name="qty" type="number" min="1" step="1" value="${num(s.qty)||1}" required></label>
      <label>Precio unitario<input name="unitPrice" type="number" min="0" step="1" value="${num(s.unitPrice)}" required></label>
      <label>IVA %<input name="ivaRate" type="number" min="0" step="0.01" value="${s.ivaRate??13}"></label>
      <label>Garantía<input name="warranty" value="${esc2(s.warranty||'')}"></label>
      <label>Método de pago<select name="payment">
        ${['Contado','Sinpe','Tarjeta','Transferencia','Otro'].map(x=>`<option ${s.payment===x?'selected':''}>${x}</option>`).join('')}
      </select></label>
      <label>Marca vehículo<input name="vehicleMake" value="${esc2(s.vehicle?.make||'')}"></label>
      <label>Modelo vehículo<input name="vehicleModel" value="${esc2(s.vehicle?.model||'')}"></label>
      <label>Año<input name="vehicleYear" type="number" min="1980" max="2026" value="${esc2(s.vehicle?.year||'')}"></label>
      <label>Combustible<select name="fuel">
        ${['','Gasolina','Diésel','Híbrido','Eléctrico'].map(x=>`<option value="${esc2(x)}" ${String(s.vehicle?.fuel||'')===x?'selected':''}>${x||'No indicado'}</option>`).join('')}
      </select></label>
      <label class="full">Observación<input name="note" value="${esc2(s.note||'')}"></label>
      <div class="full actions"><button class="btn">Guardar cambios</button></div>
    </form>`);

    const f=document.getElementById('editSaleForm');
    f.onsubmit=e=>{
      e.preventDefault();
      const d=new FormData(f);
      const newProduct=products.find(p=>String(p.id)===String(d.get('product')));
      const q=num(d.get('qty'));
      const up=num(d.get('unitPrice'));
      if(!newProduct||q<1||!Number.isInteger(q)){alert('Cantidad inválida.');return;}
      if(up<0){alert('Precio inválido.');return;}

      const oldProduct=products.find(p=>String(p.id)===String(s.productId))||products.find(p=>String(p.code)===String(s.product));
      const oldQty=num(s.qty);

      // Primero se devuelve al inventario la cantidad de la venta anterior.
      if(oldProduct) oldProduct.qty=num(oldProduct.qty)+oldQty;

      // Luego se verifica y descuenta la nueva venta.
      if(q>num(newProduct.qty)){
        if(oldProduct) oldProduct.qty=num(oldProduct.qty)-oldQty;
        alert('No hay suficiente existencia para la nueva cantidad.');
        return;
      }
      newProduct.qty=num(newProduct.qty)-q;

      Object.assign(s,{
        date:normDate(d.get('date')),
        client:d.get('client')||'Cliente contado',
        phone:d.get('phone')||'',
        product:newProduct.code,
        productId:newProduct.id,
        brand:newProduct.brand,
        model:newProduct.model,
        voltage:newProduct.voltage||'12V',
        amp:newProduct.amp||'',
        unitCost:num(newProduct.cost),
        unitPrice:up,
        total:q*up,
        qty:q,
        warranty:d.get('warranty')||newProduct.warranty||'Por definir',
        payment:d.get('payment')||'',
        ivaRate:num(d.get('ivaRate')||13),
        note:d.get('note')||'',
        vehicle:{
          make:d.get('vehicleMake')||'',
          model:d.get('vehicleModel')||'',
          year:d.get('vehicleYear')||'',
          fuel:d.get('fuel')||''
        }
      });

      // Mantener la garantía ligada a la venta, si existe.
      const w=(db.warranties||[]).find(x=>String(x.saleId)===String(s.id));
      if(w){
        w.date=s.date; w.client=s.client; w.battery=s.product;
      }
      save(); closeModal(); sales();
    };
  };

  window.sales=function(){
    normalizeSalesDates();
    save();
    const rows=(db.sales||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date))||Number(b.id)-Number(a.id));
    app.innerHTML=`<div class="page-title"><div><h1>Ventas</h1><div class="muted">Registro de ventas, CCA, salida de inventario y garantía.</div></div><button class="btn" onclick="openSale()">+ Nueva venta</button></div>
    <div class="table-wrap"><table class="table"><thead><tr>
      <th>Fecha</th><th>Cliente</th><th>Vehículo</th><th>Batería</th><th>CCA</th><th>Cant.</th><th>Unitario</th><th>Total</th><th>Acciones</th>
    </tr></thead><tbody>${rows.length?rows.map(x=>{
      const p=(db.inventory||[]).find(q=>String(q.id)===String(x.productId))||(db.inventory||[]).find(q=>String(q.code)===String(x.product));
      const cca=x.amp||p?.amp||'No indicado';
      return `<tr><td>${esc2(x.date)}</td>
        <td>${esc2(x.client)}<br><small>${esc2(x.phone||'')}</small></td>
        <td>${esc2([x.vehicle?.make,x.vehicle?.model,x.vehicle?.year].filter(Boolean).join(' '))||'—'}</td>
        <td>${esc2(x.product)}<br><small>${esc2([x.brand,x.model].filter(Boolean).join(' '))}</small></td>
        <td><b>${esc2(cca)}</b></td><td>${esc2(x.qty)}</td><td>${money(x.unitPrice)}</td><td><b>${money(x.total)}</b></td>
        <td><div class="sale-actions"><button class="btn secondary" onclick="openSaleEdit(${JSON.stringify(x.id)})">✏️ Modificar</button><button class="btn secondary" onclick="openWarrantyReportById(${JSON.stringify(x.id)})">Garantía</button><button class="danger-link" onclick="deleteSale(${JSON.stringify(x.id)})">Anular</button></div></td>
      </tr>`;
    }).join(''):`<tr><td colspan="9" class="empty">Todavía no hay ventas.</td></tr>`}</tbody></table></div>`;
  };

  window.accounting=function(){
    normalizeSalesDates();
    if(typeof wrInitAccounting==='function') wrInitAccounting();
    normalizeSalesDates(); save();
    const salesData=db.sales||[];
    const expenses=Array.isArray(db.expenses)?db.expenses:[];
    const monthStart=today().slice(0,7)+'-01';
    app.innerHTML=`<div class="page-title"><div><h1>Contabilidad</h1><div class="muted">Ventas por fecha, costo, utilidad, IVA estimado y gastos.</div></div><button class="btn" onclick="openExpense()">+ Registrar gasto</button></div>
      <div class="panel"><h3>📅 Ventas por fechas</h3><div class="date-filter">
        <label>Desde<input id="accFrom" type="date" value="${monthStart}"></label>
        <label>Hasta<input id="accTo" type="date" value="${today()}"></label>
        <button class="btn" onclick="renderAccountingPeriod()">Consultar</button>
        <button class="btn secondary" onclick="setAccountingToday()">Hoy</button>
        <button class="btn secondary" onclick="setAccountingMonth()">Este mes</button>
      </div></div><div id="accBody"></div>`;
    renderAccountingPeriod();
  };

  window.setAccountingToday=function(){
    const f=document.getElementById('accFrom'),t=document.getElementById('accTo');
    if(f)f.value=today(); if(t)t.value=today(); renderAccountingPeriod();
  };
  window.setAccountingMonth=function(){
    const f=document.getElementById('accFrom'),t=document.getElementById('accTo');
    if(f)f.value=today().slice(0,7)+'-01'; if(t)t.value=today(); renderAccountingPeriod();
  };

  window.renderAccountingPeriod=function(){
    normalizeSalesDates();
    const from=document.getElementById('accFrom')?.value||'1980-01-01';
    const to=document.getElementById('accTo')?.value||'2999-12-31';
    if(from>to){alert('La fecha Desde no puede ser mayor que Hasta.');return;}
    const ss=(db.sales||[]).filter(x=>normDate(x.date)>=from&&normDate(x.date)<=to);
    const es=(db.expenses||[]).filter(x=>normDate(x.date)>=from&&normDate(x.date)<=to);
    const revenue=ss.reduce((a,x)=>a+num(x.total),0);
    const cost=ss.reduce((a,x)=>a+num(x.qty)*num(x.unitCost),0);
    const gross=revenue-cost;
    const expenseTotal=es.reduce((a,x)=>a+num(x.amount),0);
    const net=gross-expenseTotal;

    const byPay={}; ss.forEach(x=>{const k=x.payment||'No indicado';byPay[k]=(byPay[k]||0)+num(x.total)});
    const daily=Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0]));
    const rows=ss.slice().sort((a,b)=>normDate(b.date).localeCompare(normDate(a.date))).map(x=>{
      const p=(db.inventory||[]).find(q=>String(q.id)===String(x.productId))||(db.inventory||[]).find(q=>String(q.code)===String(x.product));

    }).join('');
    const expRows=es.slice().sort((a,b)=>normDate(b.date).localeCompare(normDate(a.date))).map(x=>`<tr><td>${esc2(normDate(x.date))}</td><td>${esc2(x.category)}</td><td>${esc2(x.description)}</td><td>${money(x.amount)}</td><td><button class="danger-link" onclick="deleteExpense(${JSON.stringify(x.id)})">Eliminar</button></td></tr>`).join('');
    const dayRows=daily.map(([date,v])=>`<tr><td>${date}</td><td>${v.units}</td><td>${money(v.revenue)}</td><td>${money(v.cost)}</td><td>${money(v.revenue-v.cost)}</td></tr>`).join('');
    const payRows=Object.entries(byPay).map(([k,v])=>`<tr><td>${esc2(k)}</td><td>${money(v)}</td></tr>`).join('');
    document.getElementById('accBody').innerHTML=`<div class="cards">
      <div class="card"><div class="muted">Ventas</div><div class="metric">${money(revenue)}</div></div>
      <div class="card"><div class="muted">Costo de baterías vendidas</div><div class="metric">${money(cost)}</div></div>
      <div class="card"><div class="muted">Utilidad bruta</div><div class="metric">${money(gross)}</div></div>
      <div class="card"><div class="muted">Gastos</div><div class="metric">${money(expenseTotal)}</div></div>
      <div class="card"><div class="muted">Resultado operativo</div><div class="metric">${money(net)}</div></div>
      <div class="card"><div class="muted">IVA estimado incluido en ventas</div><div class="metric">${money(iva)}</div></div>
    </div>
    <div class="panel"><h3>📊 Resumen diario</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Unidades</th><th>Ventas</th><th>Costo</th><th>Utilidad bruta</th></tr></thead><tbody>${dayRows||'<tr><td colspan="5" class="empty">No hay ventas en este período.</td></tr>'}</tbody></table></div></div>
    <div class="panel"><h3>🧾 Detalle de ventas</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Batería</th><th>Vehículo</th><th>Cant.</th><th>CCA</th><th>Unitario</th><th>Total</th><th>Costo</th><th>Utilidad</th></tr></thead><tbody>${rows||'<tr><td colspan="10" class="empty">No hay ventas en este período.</td></tr>'}</tbody></table></div></div>
    <div class="panel"><h3>💳 Ventas por método de pago</h3><div class="table-wrap"><table class="table"><thead><tr><th>Método</th><th>Total</th></tr></thead><tbody>${payRows||'<tr><td colspan="2" class="empty">Sin datos.</td></tr>'}</tbody></table></div></div>
    <div class="panel"><h3>💸 Gastos</h3><div class="table-wrap"><table class="table"><thead><tr><th>Fecha</th><th>Categoría</th><th>Descripción</th><th>Monto</th><th></th></tr></thead><tbody>${expRows||'<tr><td colspan="5" class="empty">No hay gastos en este período.</td></tr>'}</tbody></table></div></div>`;
  };

  // La navegación ya existente seguirá entrando aquí porque reemplazamos la función global.
  normalizeSalesDates();
  save();
})();
</script>


<script>
/* ===== IDENTIDAD + EDICIÓN DE VENTAS: ACEPTAR Y GUARDAR ===== */
(function(){
  document.title='WRBATERIASCR';
  const style=document.createElement('style');
  style.textContent=`
    .edit-sale-actions{position:sticky;bottom:0;background:#fff;border-top:1px solid #e5e7eb;padding:12px 0 2px;margin-top:4px;display:flex;gap:10px;justify-content:flex-end;z-index:3}
    .edit-sale-actions .btn{min-width:150px}
    .edit-save-ok{font-size:12px;color:#176b2c;margin:7px 0 0}
  `;
  document.head.appendChild(style);

  const escLocal=window.esc || (x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
  const numLocal=v=>Number.isFinite(Number(v))?Number(v):0;
  const normDateLocal=v=>{const s=String(v??'').trim();if(!s)return new Date().toISOString().slice(0,10);const m=s.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:s};

  window.openSaleEdit=function(id){

    const options=products.map(p=>`<option value="${escLocal(p.id)}" ${oldProduct&&String(p.id)===String(oldProduct.id)?'selected':''}>${escLocal(p.code)} — ${escLocal(p.brand)} ${escLocal(p.model)} — CCA ${escLocal(p.amp||'No indicado')} — Stock ${escLocal(p.qty)}</option>`).join('');

      <label>Teléfono<input name="phone" value="${escLocal(s.phone||'')}"></label>
      <label>Cantidad<input name="qty" type="number" min="1" step="1" value="${numLocal(s.qty)||1}" required></label>
      <label>Precio unitario<input name="unitPrice" type="number" min="0" step="1" value="${numLocal(s.unitPrice)}" required></label>
      <label>IVA %<input name="ivaRate" type="number" min="0" step="0.01" value="${s.ivaRate??13}"></label>
      <label>Garantía<input name="warranty" value="${escLocal(s.warranty||'')}"></label>
      <label>Método de pago<select name="payment">${['Contado','Sinpe','Tarjeta','Transferencia','Otro'].map(x=>`<option ${String(s.payment||'')===x?'selected':''}>${x}</option>`).join('')}</select></label>
      <label>Marca vehículo<input name="vehicleMake" value="${escLocal(s.vehicle?.make||'')}"></label>
      <label>Modelo vehículo<input name="vehicleModel" value="${escLocal(s.vehicle?.model||'')}"></label>
      <label>Año<input name="vehicleYear" type="number" min="1980" max="2026" value="${escLocal(s.vehicle?.year||'')}"></label>
      <label>Combustible<select name="fuel">${['','Gasolina','Diésel','Híbrido','Eléctrico'].map(x=>`<option value="${escLocal(x)}" ${String(s.vehicle?.fuel||'')===x?'selected':''}>${x||'No indicado'}</option>`).join('')}</select></label>
      <label class="full">Observación<input name="note" value="${escLocal(s.note||'')}"></label>
      <div class="full edit-sale-actions">
        <button class="btn secondary" type="button" id="cancelEditSale">Cancelar</button>
        <button class="btn" type="submit">✅ Aceptar y guardar cambios</button>
      </div>
      <div class="full edit-save-ok">Al aceptar, la venta se guarda en el almacenamiento de la aplicación y se actualiza el inventario.</div>
    </form>`);

    const f=document.getElementById('editSaleForm');
    document.getElementById('cancelEditSale').onclick=()=>closeModal();
    f.onsubmit=function(e){

      const newProduct=products.find(p=>String(p.id)===String(d.get('product')));
      const q=numLocal(d.get('qty')), up=numLocal(d.get('unitPrice'));
      if(!newProduct || q<1 || !Number.isInteger(q)){alert('Cantidad inválida.');return;}
      if(!Number.isFinite(up)||up<0){alert('Precio unitario inválido.');return;}

      const previousProduct=products.find(p=>String(p.id)===String(s.productId)) || products.find(p=>String(p.code)===String(s.product));
      const previousQty=numLocal(s.qty);

      // Revertir primero la salida anterior.
      if(previousProduct) previousProduct.qty=numLocal(previousProduct.qty)+previousQty;
      // Validar contra el inventario ya restaurado.
      if(q>numLocal(newProduct.qty)){
        if(previousProduct) previousProduct.qty=numLocal(previousProduct.qty)-previousQty;
        alert('No hay suficiente existencia para la nueva cantidad.');
        return;
      }
      newProduct.qty=numLocal(newProduct.qty)-q;

      Object.assign(s,{
        date:normDateLocal(d.get('date')),
        client:String(d.get('client')||'Cliente contado'),
        phone:String(d.get('phone')||''),
        product:newProduct.code, productId:newProduct.id,
        brand:newProduct.brand, model:newProduct.model,
        voltage:newProduct.voltage||'12V', amp:newProduct.amp||'',
        unitCost:numLocal(newProduct.cost), unitPrice:up, total:q*up, qty:q,
        warranty:String(d.get('warranty')||newProduct.warranty||'Por definir'),
        payment:String(d.get('payment')||''), ivaRate:numLocal(d.get('ivaRate')||13), note:String(d.get('note')||''),
        vehicle:{make:String(d.get('vehicleMake')||''),model:String(d.get('vehicleModel')||''),year:String(d.get('vehicleYear')||''),fuel:String(d.get('fuel')||'')}
      });
      const w=(db.warranties||[]).find(x=>String(x.saleId)===String(s.id));
      if(w){w.date=s.date;w.client=s.client;w.battery=s.product;}

      // Guardado explícito y verificación inmediata.
      save();
      const check=db.sales.find(x=>String(x.id)===String(id));
      if(!check || check.total!==s.total || check.date!==s.date){
        alert('No se pudo confirmar el guardado.');
        return;
      }
      closeModal();
      if(typeof window.sales==='function') window.sales();
    };
  };
})();
</script>

<script>
/* ===== WRBATERIASCR — REPARACIÓN GENERAL BUSCADOR BCI v2026-09-18 =====
   Regla: primero aplicación BCI exacta; si el año no coincide, busca el mismo
   modelo sin inventar el grupo y marca el resultado como referencia por año.
   Nunca convierte N-50/N-70 automáticamente a BCI.
*/
(function(){
  const N=v=>String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/[^A-Z0-9]+/g,' ').trim();
  const alias={CHEVY:'CHEVROLET',VW:'VOLKSWAGEN',VOLKSWAGEN:'VOLKSWAGEN'};
  const mk=v=>alias[N(v)]||N(v);
  const mo=v=>N(v);
  const year=v=>Number(v||0);
  const rows=()=>typeof APLICACIONES_VEHICULOS!=='undefined'&&Array.isArray(APLICACIONES_VEHICULOS)?APLICACIONES_VEHICULOS:[];
  const verified=[
    {make:'TOYOTA',model:'TERCEL',y1:1991,y2:1999,groups:['25'],note:'Aplicación BCI registrada para Toyota Tercel 1991–1999.'},
    {make:'CHEVROLET',model:'CRUZE',y1:2011,y2:2015,groups:['47'],note:'Aplicación publicada para Chevrolet Cruze 2011–2015: BCI 47/H5.'},
    {make:'CHEVROLET',model:'CRUZE',y1:2016,y2:2019,groups:['48'],note:'Aplicación publicada para Chevrolet Cruze 2016–2019: BCI 48/H6; algunas configuraciones pueden usar 94R/H7.'},
    {make:'HYUNDAI',model:'TUCSON',y1:2010,y2:2015,groups:['124R'],note:'Aplicación registrada para Hyundai Tucson 2010–2015; confirmar motor, mercado y polaridad en importados.'}
  ];
  function modelMatch(a,b){
    const x=mo(a),y=mo(b);
    return x===y || x.includes(y) || y.includes(x) || x.replace(/\s+/g,'')===y.replace(/\s+/g,'');
  }
  function getGroups(r){
    const vals=r.groups||[r.b1,r.b2];
    return [...new Set((vals||[]).map(x=>String(x||'').trim()).filter(x=>x&&x!=='-'))];
  }
  function findBCI(make,model,yr){
    const M=mk(make), O=mo(model), Y=year(yr);
    const all=rows();
    let hits=all.filter(r=>mk(r.make)===M&&modelMatch(r.model,O)&&(!Y||(Y>=Number(r.y1)&&Y<=Number(r.y2))));
    let source='tabla BCI'; let yearExact=!!hits.length;
    if(!hits.length){
      hits=all.filter(r=>mk(r.make)===M&&modelMatch(r.model,O));
      if(hits.length) source='tabla BCI (modelo encontrado; año fuera del rango)';
    }
    if(!hits.length){
      hits=verified.filter(r=>r.make===M&&modelMatch(r.model,O)&&(!Y||(Y>=r.y1&&Y<=r.y2)));
      if(hits.length) {source='aplicación BCI verificada'; yearExact=true;}
    }
    if(!hits.length){
      hits=verified.filter(r=>r.make===M&&modelMatch(r.model,O));
      if(hits.length) source='aplicación BCI verificada (modelo encontrado; año fuera del rango)';
      yearExact=false;
    }
    if(!hits.length)return null;
    const groups=[...new Set(hits.flatMap(getGroups))];
    if(!groups.length)return null;
    const y1=Math.min(...hits.map(r=>Number(r.y1)||Y).filter(Boolean));
    const y2=Math.max(...hits.map(r=>Number(r.y2)||Y).filter(Boolean));
    return {groups,source,yearExact,range:[y1,y2],note:hits[0].note||'Grupo BCI tomado de una aplicación registrada.'};
  }
  window.WR_BCI_LOOKUP=findBCI;
  window.wrBCI=function(make,model,yr,battery){
    const rec=findBCI(make,model,yr);
    if(rec)return {value:rec.groups.join(' / '),status:rec.yearExact?'verificado':'referencia-modelo',note:rec.note,source:rec.source};
    const b=N(battery);
    const m=b.match(/\b(124R|94R|96R|75\/86|48\/91|34\/78|51R|42R|40R|27F|24R|22F|31T|31P|35|34|42|47|48|49|51|58|65|75|78|86|99|24|25|26|27|31|41|H5|H6|H7)\b/);
    if(m){const v=m[1].replace(/^H5$/,'47').replace(/^H6$/,'48').replace(/^H7$/,'94R');return {value:v,status:'por-codigo',note:'Grupo BCI identificado directamente en la referencia de batería.'};}
    return {value:'BCI no verificado',status:'no-verificado',note:'No hay una aplicación BCI verificada para esta combinación en la base instalada. No se inventa una equivalencia JIS.'};
  };
  window.wrVehicleSearch=function(){
    const make=document.getElementById('wrVMake')?.value?.trim()||'';
    const model=document.getElementById('wrVModel')?.value?.trim()||'';
    const yr=document.getElementById('wrVYear')?.value||'';
    const fuel=document.getElementById('wrVFuel')?.value||'';
    const box=document.getElementById('wrVehicleResult');
    if(!box)return;
    if(!make||!model){box.innerHTML='<div class="notice">Ingrese marca y modelo.</div>';return;}
    const rec=findBCI(make,model,yr);
    let catalog=null;
    if(typeof window.wrVehicleFind==='function' && window.wrVehicleFind!==arguments.callee){
      try{catalog=window.wrVehicleFind(make,model,yr,fuel);}catch(e){}
    }
    if(!rec && !catalog){box.innerHTML='<div class="notice"><b>No hay un grupo BCI verificado para esa combinación.</b><br>Revise marca, modelo, año, motor, polaridad y dimensiones antes de vender.</div>';return;}
    const bci=rec?window.wrBCI(make,model,yr,catalog?.battery):window.wrBCI(catalog.make,catalog.model,yr,catalog.battery);
    const shownMake=catalog?.make||make, shownModel=catalog?.model||model;
    const range=rec?.range||catalog?.range||[yr||'',yr||''];
    const battery=rec?rec.groups.join(' / '):(catalog?.battery||'');
    const note=rec?.note||catalog?.note||'';
    const statusText=bci.status==='verificado'?'Aplicación BCI verificada':(bci.status==='referencia-modelo'?'Modelo encontrado; el año indicado está fuera del rango exacto':'Referencia BCI');
    const cls=bci.status==='no-verificado'?'bci-warn':'bci-ok';
    const yearWarning=rec&&!rec.yearExact?'<div class="notice">⚠️ El modelo sí está en la base, pero el año indicado está fuera del rango exacto de la aplicación. Confirme la batería instalada.</div>':'';
    const msg='Hola WRBATERIASCR, quiero confirmar batería para '+shownMake+' '+shownModel+(yr?' '+yr:'')+(fuel?' '+fuel:'')+'. Grupo BCI mostrado: '+bci.value+'. Referencia: '+battery+'.';
    box.innerHTML='<div class="vehicle-hit"><h3>🔋 '+esc(shownMake)+' '+esc(shownModel)+'</h3>'+
      '<div class="bci-result '+cls+'"><span>GRUPO BCI</span><strong>'+esc(bci.value)+'</strong><small>'+esc(statusText+' — '+(bci.source||''))+'</small></div>'+
      '<div class="bateria-recomendada">'+esc(battery)+'</div>'+
      '<p><b>Años registrados:</b> '+esc(String(range[0]))+'–'+esc(String(range[1]))+'</p>'+
      '<p><b>Nota:</b> '+esc(note)+'</p>'+yearWarning+
      '<p class="nota"><b>Importante:</b> el grupo BCI mostrado proviene de una aplicación registrada. En vehículos importados o con diferentes motores/mercados se debe comprobar polaridad, dimensiones, CCA y la batería instalada.</p>'+
      '</div>';
  };
})();
</script>

<script>
/* ===== WRBATERIASCR — GARANTÍA DESDE FACTURACIÓN + MODO OFFLINE ===== */
(function(){
  const escW=window.esc || (x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m])));
  function parseMonths(v){
    const s=String(v??'').toLowerCase().trim();
    const m=s.match(/(\d+(?:\.\d+)?)\s*(?:mes|meses)/);
    if(m)return Number(m[1]);
    const n=Number(s); return Number.isFinite(n)&&n>0?n:0;
  }
  function addMonths(dateStr, months){
    const base=new Date(String(dateStr)+'T00:00:00');
    if(Number.isNaN(base.getTime())||!months)return '';
    const day=base.getDate();
    const d=new Date(base.getFullYear(),base.getMonth()+months,1);
    const last=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();
    d.setDate(Math.min(day,last));
    return d.toISOString().slice(0,10);
  }
  function dmy(v){
    const s=String(v||'');
    const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return m?m[3]+'/'+m[2]+'/'+m[1]:s;
  }
  window.wrWarrantyEnd=function(date,warranty){
    const months=parseMonths(warranty);
    return months?addMonths(date,months):'';
  };
  window.wrWarrantyInfo=function(sale){
    const start=String(sale?.date||'');
    const months=parseMonths(sale?.warranty);
    const end=months?addMonths(start,months):'';
    return {months,start,end};
  };
  // Make the app identity unmistakable and local/offline.
  document.addEventListener('DOMContentLoaded',function(){
    const top=document.querySelector('.topbar>div:first-child');
    if(top) top.innerHTML='<div class="app-brand"><span class="app-battery-icon" aria-hidden="true">🔋</span><strong>WRBATERIASCR</strong><span class="offline-badge">OFFLINE</span></div>';
    document.title='WRBATERIASCR — Baterías';
  });
  // Re-rendered views can replace the topbar only once, so keep the text consistent.
  const oldRender=window.render;
  if(typeof oldRender==='function'){
    window.render=function(view){const r=oldRender(view);const top=document.querySelector('.topbar>div:first-child');if(top)top.innerHTML='<div class="app-brand"><span class="app-battery-icon" aria-hidden="true">🔋</span><strong>WRBATERIASCR</strong><span class="offline-badge">OFFLINE</span></div>';return r;};
  }
  // Override warranty certificate so duration is calculated from the invoice/sale date.
  window.openWarrantyReport=function(sale){
    const v=sale?.vehicle||{};
    const info=window.wrWarrantyInfo(sale||{});
    const dur=String(sale?.warranty||'Por definir');
    const expiry=info.end?dmy(info.end):'Por definir';
    const start=dmy(sale?.date||'');
