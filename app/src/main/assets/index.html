function documents(id){let s=db.sales.find(x=>x.id===id);if(!s)return;let m=months(s.warranty),end=m?addMonths(s.date,m):"";modal("Factura + certificado",'<div class="no-print toolbar"><button class="btn" onclick="window.print()">🖨️ Imprimir</button><button class="btn sec" onclick="closeModal()">Cerrar</button></div><div class="doc"><div class="dochead"><div><img src="'+LOGO+'" class="doclogo"><h2>WRBATERIASCR</h2><div>Tel. 6392 8294</div></div><div><h2>FACTURA</h2><div>Venta #'+s.id+'</div><div>'+dmy(s.date)+'</div></div></div><div class="docbox"><b>CLIENTE</b><div class="docrow"><span>Nombre</span><b>'+esc(s.client)+'</b></div><div class="docrow"><span>Teléfono</span><b>'+esc(s.phone||"—")+'</b></div></div><div class="docbox"><b>DETALLE</b><div class="docrow"><span>'+esc(s.product)+" — "+esc(s.brand)+" "+esc(s.model)+'</span><b>'+money(s.total)+'</b></div><div class="docrow"><span>Cantidad</span><b>'+s.qty+'</b></div><div class="docrow"><span>CCA</span><b>'+esc(s.amp||"—")+'</b></div><div class="docrow"><span>BCI</span><b>'+esc(s.profile||"No verificado")+'</b></div><div class="docrow"><span>Pago</span><b>'+esc(s.payment)+'</b></div><div class="docrow"><span>TOTAL</span><b>'+money(s.total)+'</b></div></div><hr><h2>CERTIFICADO DE GARANTÍA</h2><div class="docbox"><div class="docrow"><span>Inicio</span><b>'+dmy(s.date)+'</b></div><div class="docrow"><span>Duración</span><b>'+esc(s.warranty)+'</b></div><div class="docrow"><span>Vencimiento</span><b>'+(end?dmy(end):"Por definir")+'</b></div><div class="docrow"><span>Batería</span><b>'+esc(s.brand)+" "+esc(s.model)+'</b></div></div><div class="sign"><div class="sigline">Firma del cliente</div><div class="sigline">WRBATERIASCR</div></div></div>')}
function months(s){let m=String(s||"").match(/(\d+)\s*mes/i);return m?+m[1]:0}function addMonths(s,m){let d=new Date(s+"T12:00:00"),day=d.getDate();d.setMonth(d.getMonth()+m);if(d.getDate()<day)d.setDate(0);return d.toISOString().slice(0,10)}
function clients(){app.innerHTML='<div class="title"><h1>Clientes</h1></div><div class="tablewrap"><table class="table"><thead><tr><th>Nombre</th><th>Teléfono</th></tr></thead><tbody>'+db.clients.map(c=>'<tr><td>'+esc(c.name||c.client)+'</td><td>'+esc(c.phone||"")+'</td></tr>').join("")+'</tbody></table></div>'}
const BCI=[["chevrolet","cruze",2011,2015,"47 / H5"],["chevrolet","cruze",2016,2019,"48 / H6"],["hyundai","tucson",2010,2015,"124R"],["hyundai","elantra",2011,2016,"47 / 48"],["chevrolet","aveo",2008,2012,"75 / 86"],["chevrolet","aveo",2013,2022,"47 / 42"],["toyota","tercel",1991,1999,"25"],["chevrolet","silverado",1996,2007,"34 / 78"],["chevrolet","silverado",2008,2013,"48 / 91 / 41"]];
function vehicles(){app.innerHTML='<div class="title"><div><h1>Vehículos</h1><div class="muted">Busca por marca, modelo y año.</div></div></div><div class="panel"><h2>🔎 Buscar batería por vehículo</h2><div class="searchgrid"><label>Marca<input id="vm" placeholder="Toyota"></label><label>Modelo<input id="vmo" placeholder="Corolla"></label><label>Año<input id="vy" type="number" min="1980" max="2026" placeholder="2010"></label><label>&nbsp;<button class="btn" onclick="searchVehicle()">Buscar</button></label></div><div id="vr"></div></div><div class="panel"><h2>Vehículos registrados</h2><div class="tablewrap"><table class="table"><thead><tr><th>Marca</th><th>Modelo</th><th>Año</th><th>Combustible</th></tr></thead><tbody>'+db.vehicles.map(v=>'<tr><td>'+esc(v.make)+'</td><td>'+esc(v.model)+'</td><td>'+esc(v.year)+'</td><td>'+esc(v.fuel)+'</td></tr>').join("")+'</tbody></table></div></div>'}
function searchVehicle(){let make=vm.value.trim(),model=vmo.value.trim(),year=+vy.value||0;if(!make||!model)return alert("Escriba marca y modelo.");let bats=[];db.inventory.forEach(p=>String(p.vehicles||"").split(";").forEach(x=>{let u=x.toUpperCase();if(u.includes(make.toUpperCase())&&u.includes(model.toUpperCase())){let z=u.match(/(19|20)\d{2}-(19|20)\d{2}/);if(!year||!z||year>=+z[0].slice(0,4)&&year<=+z[0].slice(5))bats.push(p)}}));bats=[...new Map(bats.map(p=>[p.code,p])).values()];let b=BCI.find(x=>x[0]===make.toLowerCase()&&x[1]===model.toLowerCase()&&(!year||year>=x[2]&&year<=x[3]));vr.innerHTML=bats.length?'<div class="ok"><h3>'+esc(make)+" "+esc(model)+" "+(year||"")+'</h3><p><b>BCI:</b> '+esc(b?.[4]||"No verificado")+'</p>'+bats.map(p=>'<div class="docbox"><b>'+esc(p.code)+" — "+esc(p.brand)+" "+esc(p.model)+'</b><br>CCA: '+esc(p.amp||"—")+'</div>').join("")+'<small>Confirme motor, polaridad, dimensiones y batería instalada antes de vender.</small></div>':'<div class="notice"><b>No hay una aplicación registrada para esa combinación.</b><br>Pruebe otra variante del modelo.</div>'}
function warranties(){app.innerHTML='<div class="title"><h1>Garantías</h1></div><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Batería</th><th>Vencimiento</th><th></th></tr></thead><tbody>'+db.sales.map(s=>{let m=months(s.warranty),end=m?addMonths(s.date,m):"";return '<tr><td>'+dmy(s.date)+'</td><td>'+esc(s.client)+'</td><td>'+esc(s.product)+'</td><td>'+(end?dmy(end):"Por definir")+'</td><td><button class="btn sec" onclick="documents('+s.id+')">Ver certificado</button></td></tr>'}).join("")+'</tbody></table></div>'}
function reports(){let rev=db.sales.reduce((a,s)=>a+Number(s.total||0),0);app.innerHTML='<div class="title"><h1>Reportes</h1></div><div class="grid"><div class="card"><div class="muted">Ventas</div><div class="metric">'+money(rev)+'</div></div><div class="card"><div class="muted">Unidades</div><div class="metric">'+db.sales.reduce((a,s)=>a+Number(s.qty||0),0)+'</div></div></div>'}
function accounting(){let rev=db.sales.reduce((a,s)=>a+Number(s.total||0),0),cost=db.sales.reduce((a,s)=>a+Number(s.qty||0)*Number(s.unitCost||0),0),exp=db.expenses.reduce((a,s)=>a+Number(s.amount||0),0);app.innerHTML='<div class="title"><div><h1>Contabilidad</h1><div class="muted">Control interno de ventas, costos, utilidad y gastos.</div></div><button class="btn" onclick="expense()">+ Registrar gasto</button></div><div class="grid"><div class="card"><div class="muted">Ventas</div><div class="metric">'+money(rev)+'</div></div><div class="card"><div class="muted">Costo vendido</div><div class="metric">'+money(cost)+'</div></div><div class="card"><div class="muted">Utilidad bruta</div><div class="metric">'+money(rev-cost)+'</div></div><div class="card"><div class="muted">Gastos</div><div class="metric">'+money(exp)+'</div></div><div class="card"><div class="muted">Resultado operativo</div><div class="metric">'+money(rev-cost-exp)+'</div></div></div><div class="panel"><h2>Ventas</h2><div class="tablewrap"><table class="table"><thead><tr><th>Fecha</th><th>Cliente</th><th>Batería</th><th>Total</th><th>Costo</th><th>Utilidad</th></tr></thead><tbody>'+db.sales.map(s=>'<tr><td>'+dmy(s.date)+'</td><td>'+esc(s.client)+'</td><td>'+esc(s.product)+'</td><td>'+money(s.total)+'</td><td>'+money((s.qty||0)*(s.unitCost||0))+'</td><td>'+money((s.total||0)-(s.qty||0)*(s.unitCost||0))+'</td></tr>').join("")+'</tbody></table></div></div>'}
function expense(){modal("Registrar gasto",'<form id="ef" class="form"><label>Fecha<input name="date" type="date" value="'+today()+'"></label><label>Categoría<input name="category" value="Otros"></label><label class="full">Descripción<input name="description"></label><label>Monto<input name="amount" type="number" min="0"></label><div class="full actions"><button type="button" class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn">Guardar</button></div></form>');ef.onsubmit=e=>{e.preventDefault();let f=new FormData(e.target);db.expenses.push({id:Date.now(),date:f.get("date"),category:f.get("category"),description:f.get("description"),amount:+f.get("amount")||0});save();closeModal();render()}}
init();
</script></body></html>
