<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baterías N-60</title>

<style>
body {
    font-family: Arial, sans-serif;
    text-align: center;
    background: #f5f5f5;
    margin: 0;
    padding: 20px;
}

h1 {
    color: #222;
}

p {
    font-size: 18px;
}

.galeria {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    max-width: 1100px;
    margin: 30px auto;
}

.galeria img {
    width: 100%;
    max-width: 300px;
    height: auto;
    border-radius: 12px;
    background: white;
    padding: 8px;
    box-shadow: 0 3px 10px rgba(0,0,0,0.15);
}
</style>
</head>

<body>

<h1>Baterías N-60</h1>

<p>Modelos disponibles</p>

<div class="galeria">

<img src="foto1.jpeg" alt="Batería N-60">
<img src="foto2.jpeg" alt="Batería N-60">
<img src="foto3.jpeg" alt="Batería N-60">
<img src="foto4.jpeg" alt="Batería N-60">
<img src="varias.jpeg" alt="Baterías N-60">

</div>

</body>
</html>
