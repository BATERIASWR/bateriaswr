name: Reparar búsqueda y chatbot WR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reparar:
    if: "!contains(github.event.head_commit.message, '[funciones-reparadas]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reparar JavaScript y resultado de batería
        shell: python
        run: |
          from pathlib import Path
          import re
          import subprocess

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          # 1) El parche anterior puso las funciones CCA dentro del objeto baseDatos.
          #    Eso rompe todo el JavaScript. Las movemos fuera del objeto.
          bad = re.compile(
              r'(const baseDatos = \{\s*)'
              r'/\* CCA-CR-V3 \*/\s*'
              r'const referenciaCCA=.*?;\s*'
              r'function obtenerReferenciaCCA\(bateria\)\{.*?\}\s*'
              r'function formatearCCA\(v\)\{.*?\}\s*',
              re.S
          )

          cca = '''const referenciaCCA={
            "N-40":{min:410,rec:500,perfil:"Compacto / estándar"},
            "NS40M":{min:400,rec:500,perfil:"Compacto / estándar"},
            "N-50":{min:450,rec:600,perfil:"Sedán / SUV ligero"},
            "42R":{min:500,rec:550,perfil:"Sedán / SUV ligero"},
            "N-60":{min:439,rec:500,perfil:"Sedán / SUV mediano"},
            "N-70":{min:600,rec:700,perfil:"SUV / pickup / diésel"},
            "N-80":{min:null,rec:null,perfil:"Confirmar aplicación"},
            "N-100":{min:680,rec:760,perfil:"Trabajo pesado / alta demanda"}
          };

          function obtenerReferenciaCCA(bateria){
            const t=String(bateria||'').toUpperCase();
            for(const k of Object.keys(referenciaCCA).sort((a,b)=>b.length-a.length)){
              if(t.includes(k.toUpperCase())) return referenciaCCA[k];
            }
            return {min:null,rec:null,perfil:'Confirmar aplicación'};
          }

          function formatearCCA(v){
            return Number.isFinite(v)?v+' CCA':'Por confirmar';
          }

          '''

          m = bad.search(s)
          if m:
              s = s[:m.start()] + cca + 'const baseDatos = {' + s[m.end():]
          elif 'const referenciaCCA=' not in s:
              anchor = 'const baseDatos = {'
              if anchor not in s:
                  raise SystemExit('No se encontró baseDatos')
              s = s.replace(anchor, cca + anchor, 1)

          # 2) Asegurar que cada registro tenga la referencia CCA.
          old = '''    bateria:datos[3],\n    nota:datos[4]\n  };'''
          new = '''    bateria:datos[3],\n    nota:datos[4],\n    cca:obtenerReferenciaCCA(datos[3])\n  };'''
          if old in s:
              s = s.replace(old, new, 1)

          # 3) Mostrar explícitamente el grupo de batería recomendado.
          marker = '''    '<div class="bateria-recomendada">'+\n    registro.bateria+\n    "</div>"+'''
          group = '''    '<div class="bateria-recomendada">'+\n    registro.bateria+\n    "</div>"+\n\n    '<div class="cca-panel">'+\n      '<div class="cca-card"><span>Grupo de batería recomendado</span><strong style="font-size:18px">'+registro.bateria+'</strong></div>'+\n      '<div class="cca-card"><span>CCA mínimo de referencia</span><strong>'+formatearCCA(registro.cca.min)+'</strong></div>'+\n      '<div class="cca-card"><span>CCA recomendado</span><strong>'+formatearCCA(registro.cca.rec)+'</strong></div>'+\n      '<div class="cca-card"><span>Perfil</span><strong style="font-size:17px">'+registro.cca.perfil+'</strong></div>'+\n    '</div>'+\n    '<p class="cca-aviso"><strong>Referencia Costa Rica:</strong> el CCA orienta la selección según baterías encontradas en el mercado local. La aplicación exacta puede variar por motor, generación, versión, dimensiones y polaridad.</p>'+'''
          if marker in s and 'Grupo de batería recomendado' not in s:
              s = s.replace(marker, group, 1)

          # 4) El mismo grupo/CCA debe aparecer en el chatbot.
          chat_marker = '''      "🔋 Batería recomendada:"+\n      "<br>"+\n\n      '<strong style="font-size:23px;color:#d71920">'+\n      registro.bateria+\n      "</strong>"+'''
          chat_new = '''      "🔋 Batería recomendada:"+\n      "<br>"+\n\n      '<strong style="font-size:23px;color:#d71920">'+\n      registro.bateria+\n      "</strong>"+\n\n      "<br><br>"+\n      "🔋 Grupo: <strong>"+registro.bateria+"</strong>"+\n      "<br>⚡ CCA mínimo de referencia: <strong>"+formatearCCA(registro.cca.min)+"</strong>"+\n      "<br>⚡ CCA recomendado: <strong>"+formatearCCA(registro.cca.rec)+"</strong>"+\n      "<br>🎯 Perfil: <strong>"+registro.cca.perfil+"</strong>"+'''
          if chat_marker in s and '"🔋 Grupo: <strong>"+registro.bateria' not in s:
              s = s.replace(chat_marker, chat_new, 1)

          # 5) Cuatro tarjetas en escritorio; una columna en móvil.
          s = s.replace(
              '.cca-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;',
              '.cca-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;',
              1
          )

          p.write_text(s, encoding='utf-8')

          # Validación de sintaxis del script inline.
          scripts = re.findall(r'<script[^>]*>(.*?)</script>', s, re.S | re.I)
          if not scripts:
              raise SystemExit('No se encontró JavaScript inline')
          Path('/tmp/wr.js').write_text(scripts[-1], encoding='utf-8')
          subprocess.run(['node','--check','/tmp/wr.js'], check=True)
          print('JavaScript válido')

      - name: Publicar reparación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reparar búsqueda y chatbot [funciones-reparadas]"
          git push
