name: Reparar búsqueda y chatbot WR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  reparar:
    if: "!contains(github.event.head_commit.message, '[funciones-reparadas]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reparar JavaScript y resultado
        shell: python
        run: |
          from pathlib import Path
          import re, subprocess
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Corregir el error que metió las funciones CCA dentro de baseDatos.
          bad=re.compile(r'(const baseDatos = \{\s*)/\* CCA-CR-V3 \*/\s*const referenciaCCA=.*?;\s*function obtenerReferenciaCCA\(bateria\)\{.*?\}\s*function formatearCCA\(v\)\{.*?\}\s*',re.S)
          cca='''const referenciaCCA={"N-40":{min:410,rec:500,perfil:"Compacto / estándar"},"NS40M":{min:400,rec:500,perfil:"Compacto / estándar"},"N-50":{min:450,rec:600,perfil:"Sedán / SUV ligero"},"42R":{min:500,rec:550,perfil:"Sedán / SUV ligero"},"N-60":{min:439,rec:500,perfil:"Sedán / SUV mediano"},"N-70":{min:600,rec:700,perfil:"SUV / pickup / diésel"},"N-80":{min:null,rec:null,perfil:"Confirmar aplicación"},"N-100":{min:680,rec:760,perfil:"Trabajo pesado / alta demanda"}};\nfunction obtenerReferenciaCCA(bateria){const t=String(bateria||'').toUpperCase();for(const k of Object.keys(referenciaCCA).sort((a,b)=>b.length-a.length)){if(t.includes(k.toUpperCase()))return referenciaCCA[k]}return{min:null,rec:null,perfil:'Confirmar aplicación'}}\nfunction formatearCCA(v){return Number.isFinite(v)?v+' CCA':'Por confirmar'}\n\n'''
          m=bad.search(s)
          if m: s=s[:m.start()]+cca+'const baseDatos = {'+s[m.end():]

          old='''    bateria:datos[3],\n    nota:datos[4]\n  };'''
          new='''    bateria:datos[3],\n    nota:datos[4],\n    cca:obtenerReferenciaCCA(datos[3])\n  };'''
          if old in s: s=s.replace(old,new,1)

          # Mantener un solo panel CCA/grupo en el resultado.
          panel=re.compile(r'\n    \'<div class="cca-panel">\'\+\s*\n.*?\n    \'<p class="cca-aviso">.*?</p>\'\+',re.S)
          panels=panel.findall(s)
          if len(panels)>1:
              s=s.replace(panels[1],'',1)

          # Si aún no existe el grupo, insertarlo en el panel existente.
          if 'Grupo de batería recomendado' not in s:
              anchor='''    '<div class="cca-panel">'+\n      '<div class="cca-card"><span>CCA mínimo de referencia</span>'''
              insert='''    '<div class="cca-panel">'+\n      '<div class="cca-card"><span>Grupo de batería recomendado</span><strong style="font-size:18px">'+registro.bateria+'</strong></div>'+\n      '<div class="cca-card"><span>CCA mínimo de referencia</span>'''
              if anchor in s: s=s.replace(anchor,insert,1)

          # El chatbot también muestra grupo y CCA.
          chat_anchor='''      "</strong>"+\n\n      "<br><br>"+\n\n      "ℹ️ "+registro.nota+'''
          chat_insert='''      "</strong>"+\n\n      "<br><br>"+\n      "🔋 Grupo: <strong>"+registro.bateria+"</strong>"+\n      "<br>⚡ CCA mínimo de referencia: <strong>"+formatearCCA(registro.cca.min)+"</strong>"+\n      "<br>⚡ CCA recomendado: <strong>"+formatearCCA(registro.cca.rec)+"</strong>"+\n      "<br>🎯 Perfil: <strong>"+registro.cca.perfil+"</strong>"+\n\n      "<br><br>"+\n\n      "ℹ️ "+registro.nota+'''
          if '"🔋 Grupo: <strong>"+registro.bateria' not in s and chat_anchor in s:
              s=s.replace(chat_anchor,chat_insert,1)

          # Cuatro tarjetas en escritorio.
          s=s.replace('.cca-panel{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;','.cca-panel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;',1)
          p.write_text(s,encoding='utf-8')

          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S|re.I)
          Path('/tmp/wr.js').write_text(scripts[-1],encoding='utf-8')
          subprocess.run(['node','--check','/tmp/wr.js'],check=True)
          print('JavaScript válido y reparación aplicada')
      - name: Publicar reparación
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Reparar búsqueda y chatbot [funciones-reparadas]"
          git push
