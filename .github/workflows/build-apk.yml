name: Build WR APK
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore WR logo icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/wr_icon.b64 > app/src/main/res/drawable/ic_wr_logo.png
      - name: Apply WR operational fixes
        run: cat app/src/main/assets/wr_fix.js >> app/src/main/assets/index.html
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Re-sign APK with modern Android signature schemes
        run: |
          SDK_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          rm -f app/build/outputs/apk/debug/app-debug.apk
          gradle :app:assembleDebug --no-daemon
          "$SDK_BUILD_TOOLS/zipalign" -f -p 4 app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-aligned.apk
          keytool -genkeypair -v -keystore /tmp/wr-debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt
          "$SDK_BUILD_TOOLS/apksigner" sign --ks /tmp/wr-debug.keystore --ks-pass pass:android --key-pass pass:android --min-sdk-version 23 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/app-aligned.apk
          rm -f app/build/outputs/apk/debug/app-aligned.apk
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with: { name: WR-APK, path: app/build/outputs/apk/debug/app-debug.apk }
