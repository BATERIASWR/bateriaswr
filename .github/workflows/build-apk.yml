name: Build WR APK
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Use WR logo as launcher icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/wr_icon.b64 > app/src/main/res/drawable/ic_wr_logo.png
      - name: Build APK
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify APK
        run: |
          SDK_BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q "function openSale"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q "function editProduct"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q "wrVehicleSearch"
          unzip -p app/build/outputs/apk/debug/app-debug.apk assets/index.html | grep -q "REPORTE DE GARANTÍA"
      - uses: actions/upload-artifact@v4
        with: { name: WR-APK, path: app/build/outputs/apk/debug/app-debug.apk }
