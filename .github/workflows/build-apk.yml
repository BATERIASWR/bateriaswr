name: Build WR APK
on:
  pull_request:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Restore WR logo icon
        run: |
          mkdir -p app/src/main/res/drawable
          base64 -d app/src/main/wr_icon.b64 > app/src/main/res/drawable/ic_wr_logo.png
      - run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: WR-APK, path: app/build/outputs/apk/debug/app-debug.apk }
