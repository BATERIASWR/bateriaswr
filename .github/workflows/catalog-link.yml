name: Integrar catálogo de baterías
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Agregar CCA y grupos BCI
        run: |
          python3 -c "import base64; from pathlib import Path; p=Path('catalogo-baterias.js'); s=p.read_text(encoding='utf-8'); x=base64.b64decode(''.replace(' ','+')).decode(); p.write_text(s if 'WR-CCA-GRUPOS-V1' in s else s+x,encoding='utf-8')"
      - name: Integrar en index sin modificar diseño
        run: |
          python3 -c "from pathlib import Path; p=Path('index.html'); s=p.read_text(encoding='utf-8'); tag='<script src=\"catalogo-baterias.js\"></script>'; s=s.replace(r'\\n','\\n'); pos=s.lower().rfind('</body>'); s=s if tag in s else s[:pos]+tag+'\\n'+s[pos:]; p.write_text(s,encoding='utf-8')"
      - name: Publicar
        run: |
          git config user.name 'BATERIASWR'
          git config user.email 'wilber1977@gmail.com'
          git add index.html catalogo-baterias.js
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'Agregar CCA recomendado y grupos BCI'; git push; fi
