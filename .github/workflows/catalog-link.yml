name: Integrar catálogo de baterías
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar tarjetas visibles N-40 N-50 N-60 N-70
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          cambios={
            'N-40':('CCA recomendado: 340 A','Grupo BCI: 51R'),
            'N-50':('CCA recomendado: 580 A','Grupo BCI: 24R'),
            'N-60':('CCA recomendado: 490 A','Grupo BCI: 51R'),
            'N-70':('CCA recomendado: 710 A','Grupo BCI: 27')
          }
          for familia,(cca,bci) in cambios.items():
              patron=rf'(<h3>\s*{re.escape(familia)}\s*</h3>.*?<div class="cca">\s*)CCA:\s*Consultar(\s*</div>)'
              repl=rf'\1{cca}\2\n\n<div class="cca">{bci}</div>'
              s,n=re.subn(patron,repl,s,count=1,flags=re.S)
              print(f'{familia}: {n} tarjeta(s) actualizada(s)')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'BATERIASWR'
          git config user.email 'wilber1977@gmail.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'Actualizar CCA y grupo BCI en tarjetas'; git push; fi
