name: Integrar catálogo de baterías
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Actualizar tarjetas N-40 N-50 N-60 N-70
        run: |
          python3 -c "import base64;from pathlib import Path;p=Path('index.html');s=p.read_text(encoding='utf-8');exec(base64.b64decode('').decode())"
      - name: Publicar
        run: |
          git config user.name 'BATERIASWR'
          git config user.email 'wilber1977@gmail.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'Actualizar CCA y grupo BCI en tarjetas'; git push; fi
