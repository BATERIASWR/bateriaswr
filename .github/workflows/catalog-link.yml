name: Integrar catálogo de baterías
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  catalogo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar catálogo sin modificar el diseño
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          link='<a href="#baterias">Catálogo</a>'
          if link not in s:
              old='<a href="#baterias">Baterías</a>'
              if old in s:
                  s=s.replace(old, old+'\\n'+link, 1)
          tag='<script src="catalogo-baterias.js"></script>'
          if tag not in s:
              pos=s.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('No se encontró </body> en index.html')
              s=s[:pos]+tag+'\\n'+s[pos:]
          p.write_text(s, encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'BATERIASWR'
          git config user.email 'wilber1977@gmail.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'Integrar catálogo de baterías'; git push; fi
