name: Ajustar cobertura de domicilio

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: ${{ !contains(github.event.head_commit.message, 'cobertura domicilio') }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar sitio
        uses: actions/checkout@v4

      - name: Ajustar indicador de cobertura
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old_css = '''.servicio-domicilio a{\n  color:#f5b800;\n  text-decoration:none;\n}'''
          new_css = '''.servicio-domicilio a{\n  color:#f5b800;\n  text-decoration:none;\n}\n\n.cobertura-toggle{\n  appearance:none;\n  border:0;\n  background:none;\n  color:#f5b800;\n  font:inherit;\n  font-weight:800;\n  cursor:pointer;\n  padding:4px 0;\n}\n\n.cobertura-panel{\n  display:none;\n  width:min(680px,94vw);\n  margin:10px auto 0;\n  padding:14px 16px;\n  background:#151b27;\n  border:1px solid rgba(245,184,0,.45);\n  border-radius:10px;\n  text-align:center;\n  line-height:1.5;\n}\n\n.cobertura-panel.mostrar{display:block}\n\n.cobertura-panel strong{color:#f5b800}\n\n.cobertura-panel a{\n  display:inline-block;\n  margin-top:9px;\n  padding:9px 14px;\n  border-radius:7px;\n  background:#25D366;\n  color:#fff;\n  text-decoration:none;\n}\n\n@media(max-width:650px){\n  .cobertura-panel{font-size:13px}\n}'''
          if old_css not in s:
              raise SystemExit('No se encontró el bloque CSS esperado')
          s = s.replace(old_css, new_css, 1)

          old_html = '''<div class="servicio-domicilio">\n\n<div>\n<strong>🚚 SERVICIO A DOMICILIO</strong>\n<span>Se la llevamos hasta su casa</span>\n</div>\n\n<a href="tel:63928294">\n📞 6392 8294\n</a>\n\n</div>'''
          new_html = '''<div class="servicio-domicilio">\n\n<div>\n<strong>🚚 SERVICIO A DOMICILIO</strong>\n<span>Se la llevamos hasta su casa</span>\n<button class="cobertura-toggle" type="button" onclick="document.getElementById('wr-cobertura').classList.toggle('mostrar')">📍 Verificar zona de cobertura</button>\n</div>\n\n<a href="tel:63928294">\n📞 6392 8294\n</a>\n\n<div id="wr-cobertura" class="cobertura-panel" aria-live="polite">\n<strong>📍 Verifique su zona de cobertura</strong><br>\nIndíquenos su ubicación y confirmamos si podemos llevarle la batería hasta su casa.\n<br>\n<a href="https://wa.me/50663928294?text=Hola%20WRbateriasCr%2C%20quiero%20verificar%20si%20tienen%20cobertura%20a%20domicilio%20en%20mi%20zona." target="_blank">📲 Consultar cobertura por WhatsApp</a>\n</div>\n\n</div>'''
          if old_html not in s:
              raise SystemExit('No se encontró el bloque HTML esperado')
          s = s.replace(old_html, new_html, 1)
          p.write_text(s, encoding='utf-8')
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/ajustar-cobertura.yml
          git commit -m "Agregar verificación de cobertura domicilio" || exit 0
          git push
