name: Aplicar cobertura domicilio
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, 'APLICAR COBERTURA DOMICILIO') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Editar index
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='SERVICIO A DOMICILIO'
          if marker not in s:
            raise SystemExit('No se encontró SERVICIO A DOMICILIO en index.html')
          if 'wr-cobertura' not in s:
            old='''<strong>🚚 SERVICIO A DOMICILIO</strong>\n<span>Se la llevamos hasta su casa</span>'''
            new='''<strong>🚚 SERVICIO A DOMICILIO</strong>\n<span>Se la llevamos hasta su casa</span>\n<button class="cobertura-toggle" type="button" onclick="document.getElementById('wr-cobertura').classList.toggle('mostrar')">📍 Verificar zona de cobertura</button>'''
            if old not in s:
              raise SystemExit('No se encontró el bloque exacto del servicio domicilio')
            s=s.replace(old,new,1)
            anchor='''</a>\n\n</div>'''
            panel='''</a>\n\n<div id="wr-cobertura" class="cobertura-panel" aria-live="polite">\n<strong>📍 Verifique su zona de cobertura</strong><br>\nIndíquenos su ubicación y confirmamos si podemos llevarle la batería hasta su casa.\n<br>\n<a href="https://wa.me/50663928294?text=Hola%20WRbateriasCr%2C%20quiero%20verificar%20si%20tienen%20cobertura%20a%20domicilio%20en%20mi%20zona." target="_blank">📲 Consultar cobertura por WhatsApp</a>\n</div>\n\n</div>'''
            if anchor not in s:
              raise SystemExit('No se encontró cierre del bloque domicilio')
            s=s.replace(anchor,panel,1)
          css='''.cobertura-toggle{appearance:none;border:0;background:none;color:#f5b800;font:inherit;font-weight:800;cursor:pointer;padding:4px 0;}\n.cobertura-panel{display:none;width:min(680px,94vw);margin:10px auto 0;padding:14px 16px;background:#151b27;border:1px solid rgba(245,184,0,.45);border-radius:10px;text-align:center;line-height:1.5;}\n.cobertura-panel.mostrar{display:block}\n.cobertura-panel strong{color:#f5b800}\n.cobertura-panel a{display:inline-block;margin-top:9px;padding:9px 14px;border-radius:7px;background:#25D366;color:#fff;text-decoration:none;}\n@media(max-width:650px){.cobertura-panel{font-size:13px}}\n'''
          if '.cobertura-toggle{' not in s:
            pos=s.find('</style>')
            if pos<0: raise SystemExit('No se encontró </style>')
            s=s[:pos]+css+s[pos:]
          p.write_text(s,encoding='utf-8')
      - name: Guardar y eliminar workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/cobertura-fix.yml
          git commit -m 'APLICAR COBERTURA DOMICILIO'
          git push
