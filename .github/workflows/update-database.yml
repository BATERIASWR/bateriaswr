name: Actualizar base de baterias

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-database:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Actualizar aplicaciones
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          old = '"Wish":[2003,2017,["Gasolina"],"N-50","Confirmar generación."]'
          new = old + ',\n"Tercel":[1980,1999,["Gasolina"],"25 / 24 / 75/86 / 34 / 35","El grupo cambia según año, versión y mercado; confirmar antes de instalar."]'
          if '"Tercel":[1980,1999' not in s:
              if old not in s:
                  raise SystemExit('No se encontró el punto de inserción Toyota')
              s = s.replace(old, new, 1)

          old = '"Tucson":[2004,2026,["Gasolina","Diésel"],"N-70","Los diésel pueden requerir mayor capacidad."]'
          new = '"Tucson":[2004,2026,["Gasolina","Diésel"],"N-70 / 95D31R / GB90R","En 2.0 CRDi puede utilizar configuración de ~90 Ah y ~710 CCA; verificar dimensiones, polaridad y versión."]'
          if old in s:
              s = s.replace(old, new, 1)

          old = '"ix35":[2010,2015,["Gasolina","Diésel"],"N-70","Modelo equivalente a Tucson en varios mercados."]'
          new = '"ix35":[2010,2015,["Gasolina","Diésel"],"N-70 / 95D31R / GB90R","2.0 CRDi: referencia ~90 Ah y ~710 CCA; verificar dimensiones, polaridad y versión."]'
          if old in s:
              s = s.replace(old, new, 1)

          marker = '/* BASE-DATOS-REVISION-2026 */'
          if marker not in s:
              s = s.replace('const baseDatos = {', marker + '\nconst baseDatos = {', 1)

          p.write_text(s, encoding='utf-8')
          print('Base actualizada')
          PY

      - name: Validar JavaScript embebido
        run: |
          python - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          assert '"Tercel"' in s
          assert '"Tucson"' in s
          assert '"ix35"' in s
          assert '95D31R' in s and 'GB90R' in s
          assert s.count('const baseDatos = {') == 1
          print('Validacion de base de datos: OK')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Sin cambios que publicar'
            exit 0
          fi
          git commit -m 'Actualizar aplicaciones de baterias: Tucson ix35 y Toyota Tercel'
          git push
