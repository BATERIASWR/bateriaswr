name: Actualizar catalogo de baterias CR

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Actualizar catalogo
        run: python .github/patch_catalog.py

      - name: Validar cambios
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          index = Path('index.html').read_text(encoding='utf-8')
          data = json.loads(Path('data/catalogo-cr-2026.json').read_text(encoding='utf-8'))
          assert len(data['baterias']) >= 40
          assert 'catalogo-cr-verificado' in index
          assert 'CATALOGO-CR-REVISION-2026' in index
          assert '"Tercel"' in index
          assert '"Tucson"' in index
          assert '"ix35"' in index
          assert '"36F"' in index
          print('VALIDACION OK:', len(data['baterias']), 'referencias')
          PY

      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html data/catalogo-cr-2026.json .github/patch_catalog.py
          if git diff --cached --quiet; then
            echo 'Sin cambios'
            exit 0
          fi
          git commit -m 'Actualizar catalogo verificado de baterias CR'
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
