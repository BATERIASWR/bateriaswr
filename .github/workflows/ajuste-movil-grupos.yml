name: Ajustar móvil y grupos BCI
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajuste-movil-grupos.yml'
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar ajustes
        run: |
          python3 <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Grupo BCI verificado para equivalencias JIS encontradas en Costa Rica.
          marker='function obtenerGrupoBCI(bateria){'
          if marker not in s:
              needle='function formatearCCA(v){'
              fn='''function obtenerGrupoBCI(bateria){\n  const t=String(bateria||" ").toUpperCase();\n  if(/N70ZL|N70Z|N70/.test(t)) return "BCI 27";\n  if(/N50ZL/.test(t)) return "BCI 24R";\n  if(/N50Z/.test(t)) return "BCI 24";\n  if(/N40L/.test(t)) return "BCI 51R";\n  if(/NS60/.test(t)) return "BCI 51";\n  return "Por confirmar";\n}\n\n'''
              if needle in s:
                  s=s.replace(needle,fn+needle,1)

          # Mostrar grupo BCI, no repetir el código JIS como si fuera BCI.
          s=s.replace('<div class="cca-card"><span>Grupo de batería recomendado</span><strong style="font-size:18px">'+"'+registro.bateria+'"+'</strong></div>',
                      '<div class="cca-card"><span>Grupo BCI recomendado</span><strong style="font-size:22px">'+"'+obtenerGrupoBCI(registro.bateria)+'"+'</strong><small style="display:block;color:#777;margin-top:5px">JIS: '+"'+registro.bateria+'"+'</small></div>')
          s=s.replace('"<br>🔋 Grupo: <strong>"+registro.bateria+"</strong>"+',
                      '"<br>🔋 Grupo BCI recomendado: <strong>"+obtenerGrupoBCI(registro.bateria)+"</strong>"+')

          # CSS móvil: conserva la estética de PC, pero adapta sin aplastar contenido.
          css='''\n/* WR MOVIL PRO - mantiene composición PC y la adapta al ancho */\n@media(max-width:750px){\n  body{overflow-x:hidden}\n  .topbar{font-size:12px;padding:8px 10px}\n  nav{min-height:70px;padding:8px 12px;gap:8px;flex-wrap:wrap}\n  .logo{flex:0 0 auto}\n  .logo img{width:118px;max-height:52px}\n  .menu{order:3;width:100%;justify-content:flex-start;gap:20px;overflow-x:auto;white-space:nowrap;padding:4px 2px 7px;scrollbar-width:none}\n  .menu::-webkit-scrollbar{display:none}\n  .menu a{font-size:13px;flex:0 0 auto}\n  .servicio-domicilio{font-size:12px;padding:8px 10px;gap:10px;flex-wrap:wrap}\n  .hero{height:auto;min-height:0;padding:0}\n  .hero-contenido{position:relative;inset:auto;min-height:0;padding:18px 10px 22px;display:block}\n  .hero h1{font-size:31px;line-height:1.04;margin:0 auto 8px;max-width:95vw}\n  .hero p{font-size:15px;line-height:1.35;margin:0 auto 14px;max-width:90vw}\n  .wr-cambio{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding:3px 2px 10px;width:100%;scrollbar-width:none}\n  .wr-cambio::-webkit-scrollbar{display:none}\n  .wr-paso{flex:0 0 82vw;min-height:190px;height:190px;scroll-snap-align:center;padding:10px 10px 12px;border-radius:13px}\n  .wr-car{height:112px}.wr-car svg{height:108px;width:94%}.wr-paso h3{font-size:16px}.wr-paso-num{width:30px;height:30px;font-size:14px;top:9px;left:9px}\n  .productos-seccion{padding:24px 10px 45px}\n  .buscador-box{padding:20px 12px;border-radius:14px;margin-bottom:22px}\n  .buscador-titulo{margin-bottom:17px}.buscador-titulo h2{font-size:24px;line-height:1.1}.buscador-titulo p{font-size:14px}\n  .formulario{grid-template-columns:1fr;gap:9px}.formulario select{padding:13px;font-size:15px}.boton-buscar{width:100%;padding:14px;font-size:15px}\n  .resultado-busqueda{padding:16px 12px;border-left-width:4px;margin-bottom:25px}.resultado-busqueda h3{font-size:21px}\n  .bateria-recomendada{font-size:22px;padding:11px 14px;margin:10px 0}\n  .cca-panel{grid-template-columns:1fr 1fr!important;gap:8px;margin:12px 0}.cca-card{padding:12px 7px;min-width:0}.cca-card span{font-size:10px;line-height:1.25}.cca-card strong{font-size:20px;line-height:1.05;word-break:break-word}.cca-card small{font-size:10px!important}\n  .whatsapp-resultado{width:100%;text-align:center;padding:13px 10px}\n  .productos{grid-template-columns:1fr 1fr;gap:10px}.producto img{height:150px;padding:10px}.producto-info{padding:12px 8px}.producto h3{font-size:20px}.precio{font-size:18px}\n  .titulo h2,.marcas h2,.servicios h2{font-size:26px}.titulo p{font-size:15px}\n  #wr-chat{right:8px;bottom:84px;width:calc(100vw - 16px);height:min(500px,72vh);border-radius:14px}\n  #wr-chat-btn{right:12px;bottom:74px;width:56px;height:56px}\n  .whatsapp{right:12px;bottom:12px;width:52px;height:52px;font-size:24px}\n}\n@media(max-width:420px){\n  .hero h1{font-size:27px}.hero p{font-size:14px}.wr-paso{flex-basis:86vw;min-height:180px;height:180px}.wr-car{height:102px}.wr-car svg{height:98px}\n  .cca-panel{grid-template-columns:1fr 1fr!important}.cca-card strong{font-size:18px}.formulario select{font-size:14px}\n}\n'''
          if '/* WR MOVIL PRO - mantiene composición PC y la adapta al ancho */' not in s:
              s=s.replace('</style>',css+'</style>',1)

          # Agregar solamente la opción Catálogo al menú, apuntando al catálogo existente (#baterias).
          catalog_link='<a href="#baterias">Catálogo</a>'
          if catalog_link not in s:
              s=s.replace('<a href="#baterias">Baterías</a>', '<a href="#baterias">Baterías</a>\n<a href="#baterias">Catálogo</a>', 1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validar HTML y JavaScript
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          assert s.count('<script') == s.count('</script>'), 'Etiquetas script desbalanceadas'
          assert 'function obtenerGrupoBCI' in s, 'Falta función de grupo BCI'
          assert 'WR MOVIL PRO' in s, 'Falta CSS móvil'
          assert '<a href="#baterias">Catálogo</a>' in s, 'Falta opción Catálogo'
          print('OK: estructura, ajustes y catálogo encontrados')
          PY
      - name: Publicar cambios
        run: |
          git config user.name 'BATERIASWR'
          git config user.email 'wilber1977@gmail.com'
          git add index.html
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'Mejorar móvil y recomendar grupo BCI'; git push; fi
