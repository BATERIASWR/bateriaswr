name: Aplicar CCA Costa Rica v3
on:
  push:
    branches:
      - main
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        run: python3 cca_patch_v3.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Integrar CCA Costa Rica v3 [cca-integrado]" && git push)
