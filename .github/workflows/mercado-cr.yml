name: Integrar base de mercado Costa Rica
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  mercado:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Integrar catálogo y BCI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='</body>'
          if marker not in s:
              raise SystemExit('No se encontró </body>')
          tags=['<script src="catalogo-baterias.js"></script>','<script src="mercado-cr.js"></script>']
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar cambios
        run: |
          git config user.name 'BATERIASWR'
          git config user.email 'wilber1977@gmail.com'
          git add index.html mercado-cr.js
          if git diff --cached --quiet; then echo 'Sin cambios'; else git commit -m 'Corregir carga de catalogo y BCI'; git push; fi
