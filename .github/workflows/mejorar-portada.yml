name: Mejorar portada WR
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  aplicar:
    if: "!contains(github.event.head_commit.message, '[portada-aplicada]') && !contains(github.event.head_commit.message, '[reparar-funciones]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar rediseño
        run: python3 scripts/redesign_portada.py
      - name: Publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Mejorar portada WR [portada-aplicada]"
          git push
